<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumivia 曦途</title>
<meta name="theme-color" content="#F2F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#040B13" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="曦途">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<style>
/* Layout: desktop = left prototype guide + iPhone frame; phone = full-screen app.
   Brand: sky/ocean blue (trust, the route) · white (space) · sunset coral (the moments worth waking up for).
   Text tokens and fill tokens are separate so every pairing passes WCAG AA in both themes. */
:root{
  --bg:#F2F6FA; --surface:#FFFFFF; --surface-2:#E7EEF5; --fill:rgba(24,82,130,.075); --fill-2:rgba(24,82,130,.15);
  --fg:#0A1A2A; --fg-2:#43566A; --fg-3:#5E7185; --sep:rgba(20,60,100,.12);
  --sky:#0A69AC; --sky-fill:#0B6FB8; --on-sky:#FFFFFF; --sky-soft:rgba(11,111,184,.10); --sky-tint:#DDEFFC; --sky-light:#8ACFF6;
  --coral:#B0431C; --coral-fill:#F47A4E; --on-coral:#2A0F04; --coral-soft:rgba(244,122,78,.15); --sun:#FFB547;
  --ok:#137A3D; --ok-soft:rgba(22,163,74,.12); --warn:#94480A; --warn-soft:rgba(245,165,36,.17);
  --danger:#C02619; --danger-soft:rgba(217,45,32,.10); --partner:#6B4E00; --partner-soft:rgba(234,179,8,.18);
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(248,251,253,.84);
  --glass-hi:rgba(255,255,255,.95); --glass-lo:rgba(255,255,255,.35); --glass-edge:rgba(255,255,255,.6);
  --glass-shadow:0 12px 32px rgba(10,40,80,.14),0 1px 3px rgba(10,40,80,.08);
  --sheen:rgba(255,255,255,.4); --lens:rgba(11,111,184,.10); --scrim:rgba(6,20,36,.34);
  --map-land:#EEF2F5; --map-water:#B9DEF5; --map-park:#CDE9D3; --map-road:#FFFFFF; --map-ring:#D5DDE5; --map-label:#5E7185; --map-sea:#CFE9F9; --map-coast:#F6F1E6; --map-world:#FFFFFF;
  --stage:#EAF4FB; --stage-ink:#0A1A2A; --stage-mute:#4A5D70; --stage-card:rgba(255,255,255,.62);
  --bezel:#0B0E12;
  --spring:cubic-bezier(.32,.72,0,1); --overshoot:cubic-bezier(.34,1.5,.64,1); --out:cubic-bezier(.22,1,.36,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC","Helvetica Neue",sans-serif;
  --round:"SF Pro Rounded",ui-rounded,-apple-system,"PingFang SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --top:54px; --bottom:30px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#040B13; --surface:#0E1A27; --surface-2:#172636; --fill:rgba(140,180,220,.12); --fill-2:rgba(140,180,220,.2);
  --fg:#EEF4FA; --fg-2:#A6B5C4; --fg-3:#8698AB; --sep:rgba(140,170,200,.18);
  --sky:#6CC0F5; --sky-fill:#0B6FB8; --sky-soft:rgba(108,192,245,.14); --sky-tint:#0F2A40; --sky-light:#2E6E9C;
  --coral:#FF9E78; --coral-fill:#F47A4E; --coral-soft:rgba(255,158,120,.16);
  --ok:#4ADE80; --ok-soft:rgba(74,222,128,.13); --warn:#FBBF24; --warn-soft:rgba(251,191,36,.13);
  --danger:#FF7A6E; --danger-soft:rgba(255,122,110,.13); --partner:#FACC15; --partner-soft:rgba(250,204,21,.14);
  --glass:rgba(22,36,52,.52); --glass-strong:rgba(14,26,39,.86);
  --glass-hi:rgba(255,255,255,.22); --glass-lo:rgba(255,255,255,.05); --glass-edge:rgba(255,255,255,.12);
  --glass-shadow:0 12px 32px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  --sheen:rgba(255,255,255,.08); --lens:rgba(108,192,245,.16); --scrim:rgba(0,0,0,.52);
  --map-land:#13212F; --map-water:#0B3352; --map-park:#163A2B; --map-road:#22374B; --map-ring:#2A3F55; --map-label:#8EA2B6; --map-sea:#0A2740; --map-coast:#1A2A22; --map-world:#24405A;
  --stage:#060E17; --stage-ink:#EEF4FA; --stage-mute:#93A6B9; --stage-card:rgba(255,255,255,.05);
  --bezel:#1C2026; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#040B13; --surface:#0E1A27; --surface-2:#172636; --fill:rgba(140,180,220,.12); --fill-2:rgba(140,180,220,.2);
  --fg:#EEF4FA; --fg-2:#A6B5C4; --fg-3:#8698AB; --sep:rgba(140,170,200,.18);
  --sky:#6CC0F5; --sky-fill:#0B6FB8; --sky-soft:rgba(108,192,245,.14); --sky-tint:#0F2A40; --sky-light:#2E6E9C;
  --coral:#FF9E78; --coral-fill:#F47A4E; --coral-soft:rgba(255,158,120,.16);
  --ok:#4ADE80; --ok-soft:rgba(74,222,128,.13); --warn:#FBBF24; --warn-soft:rgba(251,191,36,.13);
  --danger:#FF7A6E; --danger-soft:rgba(255,122,110,.13); --partner:#FACC15; --partner-soft:rgba(250,204,21,.14);
  --glass:rgba(22,36,52,.52); --glass-strong:rgba(14,26,39,.86);
  --glass-hi:rgba(255,255,255,.22); --glass-lo:rgba(255,255,255,.05); --glass-edge:rgba(255,255,255,.12);
  --glass-shadow:0 12px 32px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  --sheen:rgba(255,255,255,.08); --lens:rgba(108,192,245,.16); --scrim:rgba(0,0,0,.52);
  --map-land:#13212F; --map-water:#0B3352; --map-park:#163A2B; --map-road:#22374B; --map-ring:#2A3F55; --map-label:#8EA2B6; --map-sea:#0A2740; --map-coast:#1A2A22; --map-world:#24405A;
  --stage:#060E17; --stage-ink:#EEF4FA; --stage-mute:#93A6B9; --stage-card:rgba(255,255,255,.05);
  --bezel:#1C2026; color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:17px;line-height:1.35}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
#app a{color:inherit;text-decoration:none}
#app a.btn.primary{color:var(--on-sky)}
input,textarea,select{font:inherit;color:var(--fg)}
:focus-visible{outline:2.5px solid var(--sky);outline-offset:2px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}

/* ── Stage + device ── */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:64px;padding:28px 24px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--stage) 0%,color-mix(in srgb,var(--stage) 80%,var(--surface)) 100%)}
.stage::before,.stage::after{content:"";position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
.stage::before{width:620px;height:620px;background:#8ACFF6;left:-180px;top:-200px;opacity:.55}
.stage::after{width:480px;height:480px;background:#F9A27E;right:-140px;bottom:-180px;opacity:.42}
.panel{width:368px;flex:none;position:relative;z-index:1;color:var(--stage-ink)}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:23px;letter-spacing:-.01em}
.brand .appicon{width:46px;height:46px;border-radius:12px;box-shadow:0 6px 16px rgba(11,80,140,.25)}
.brand small{display:block;font:600 11px/1 var(--mono);letter-spacing:.16em;color:var(--stage-mute);margin-top:5px;text-transform:uppercase}
.panel h1{font-size:36px;line-height:1.1;margin:24px 0 12px;letter-spacing:-.02em;text-wrap:balance}
.panel h1 em{font-style:normal;color:var(--coral)}
.panel>p{color:var(--stage-mute);font-size:15px;margin:0 0 22px;line-height:1.6}
.panel h3{font:600 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--stage-mute);margin:0 0 10px}
.jump{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px}
.jump button{font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px;background:var(--stage-card);box-shadow:inset 0 0 0 .5px var(--sep),0 1px 2px rgba(0,0,0,.05);backdrop-filter:blur(10px)}
.jump button:hover{background:var(--surface)}
.jump button b{color:var(--coral);font-weight:700}
.toggles{display:flex;gap:8px;margin-bottom:20px}
.toggles .seg{margin:0;flex:1;background:var(--stage-card);box-shadow:inset 0 0 0 .5px var(--sep)}
.fine{font-size:12px;color:var(--stage-mute);line-height:1.6}
.fine a{color:inherit}

.device{width:393px;height:852px;flex:none;border-radius:60px;padding:11px;background:var(--bezel);position:relative;z-index:1;
  box-shadow:0 0 0 1.5px #3A3F46,0 40px 90px rgba(10,40,80,.32),0 10px 25px rgba(10,40,80,.18)}
#app{position:relative;width:100%;height:100%;border-radius:49px;overflow:hidden;background:var(--bg);isolation:isolate;font-size:17px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:200}
.statusbar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;justify-content:space-between;align-items:center;padding:4px 32px 0 48px;font:600 16px/1 var(--round);z-index:190;pointer-events:none;color:var(--fg)}
.statusbar .r{display:flex;gap:6px;align-items:center}
.statusbar.light{color:#fff}
@media (max-width:860px){
  .stage{display:block;padding:0;height:100%}
  .stage::before,.stage::after,.panel{display:none}
  .device{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
  #app{border-radius:0}
  .island,.statusbar{display:none}
  :root{--top:calc(12px + env(safe-area-inset-top,0px));--bottom:max(12px,env(safe-area-inset-bottom,0px))}
  html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
}

/* ── Liquid Glass ── (controls layer only; content stays on solid surfaces for legibility) */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(190%);backdrop-filter:blur(18px) saturate(190%);
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 1.5px var(--glass-lo),inset 0 0 0 .6px var(--glass-edge),var(--glass-shadow)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(140deg,var(--sheen),transparent 38%,transparent 70%,var(--sheen) 100%);opacity:.9}
.glass-strong{background:var(--glass-strong);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%)}
.press{transition:transform 180ms var(--spring),filter 180ms}
.press:active{transform:scale(.96);filter:brightness(.97)}

/* ── Screen stack: tabs cross-fade, drill-ins push ── */
.screen{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  transition:transform 440ms var(--spring),opacity 300ms ease,filter 440ms var(--spring)}
.tabscreen{opacity:0;visibility:hidden;transition:opacity 260ms ease,visibility 0s 260ms,transform 440ms var(--spring),filter 440ms var(--spring)}
.tabscreen.active{opacity:1;visibility:visible;transition:opacity 260ms ease,visibility 0s,transform 440ms var(--spring),filter 440ms var(--spring)}
.push{transform:translateX(100%);box-shadow:-10px 0 30px rgba(0,0,0,.08);z-index:10}
.push.in{transform:none}
.under{transform:translateX(-24%);filter:brightness(.88)}
.scroller{flex:1;overflow-y:auto;overflow-x:hidden;padding-top:calc(var(--top) + 50px);padding-bottom:130px;scrollbar-width:none;overscroll-behavior:contain}
.scroller::-webkit-scrollbar{display:none}
.navbar{position:absolute;top:0;left:0;right:0;z-index:20;padding:calc(var(--top) + 2px) 16px 8px;display:flex;align-items:center;gap:10px;min-height:calc(var(--top) + 54px);pointer-events:none}
.navbar>*{pointer-events:auto}
.navbar::before{content:"";position:absolute;inset:0 0 -18px;pointer-events:none;opacity:0;transition:opacity .25s;
  background:linear-gradient(var(--bg) 0%,color-mix(in srgb,var(--bg) 70%,transparent) 60%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.scrolled .navbar::before{opacity:1}
.navbar>*{position:relative}
.navbar .sp{flex:1;pointer-events:none}
.ntitle{position:absolute!important;left:72px;right:72px;bottom:18px;text-align:center;font-weight:600;font-size:17px;opacity:0;transform:translateY(4px);transition:.25s;pointer-events:none!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scrolled .ntitle{opacity:1;transform:none}
.ltitle{font-size:34px;font-weight:700;letter-spacing:-.01em;padding:0 20px 4px;transition:opacity .2s;line-height:1.15}
.lsub{padding:0 20px 8px;color:var(--fg-2);font-size:15px}
.scrolled .ltitle{opacity:0}
.cbtn{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.cbtn svg.i{width:21px;height:21px;stroke-width:2.1}
.pill{position:relative;height:44px;border-radius:22px;padding:0 16px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:16px;flex:none}
.pill svg.i{width:17px;height:17px;stroke-width:2.3}

/* ── Floating tab dock ── */
.dock{position:absolute;left:14px;right:14px;bottom:var(--bottom);display:flex;gap:10px;align-items:center;z-index:40;transition:transform 480ms var(--spring),opacity 300ms}
.dock.hide{transform:translateY(150%);opacity:0;pointer-events:none}
.tabbar{position:relative;flex:1;height:64px;border-radius:32px;display:flex;padding:4px}
.lens{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/4);transition:transform 520ms var(--overshoot);z-index:0}
.lens i{display:block;height:100%;border-radius:28px;background:var(--lens);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 .5px var(--glass-edge)}
.lens.squish i{animation:squish 520ms var(--spring)}
@keyframes squish{0%{transform:scale(1)}35%{transform:scale(1.18,.86)}100%{transform:scale(1)}}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;position:relative;z-index:1;color:var(--fg);border-radius:28px}
.tab svg.i{width:24px;height:24px}
.tab.on{color:var(--sky)}
.tab.on svg.i{stroke-width:2.2}
.fab{position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--sky)}
.fab svg.i{width:26px;height:26px;stroke-width:2.4}

/* ── Common ── */
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:24px 20px 10px;gap:12px}
.sec h2{font-size:22px;font-weight:700;margin:0;letter-spacing:-.005em}
.sec button.more{font-size:15px;color:var(--sky);font-weight:500;white-space:nowrap}
.sub{font-size:13px;color:var(--fg-3)}
.group{background:var(--surface);border-radius:24px;margin:0 16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px;position:relative;width:100%}
.row+.row::before{content:"";position:absolute;top:0;left:58px;right:0;height:.5px;background:var(--sep)}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-weight:500;font-size:17px}
.row .rt span{display:block;font-size:13px;color:var(--fg-2);margin-top:1px}
.row .val{color:var(--fg-2);font-size:15px;white-space:nowrap}
.row .chev{color:var(--fg-3);width:16px;height:16px;stroke-width:2.4}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.ico svg.i{width:18px;height:18px;stroke-width:2}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 14px;border-radius:18px;background:var(--surface);font-size:15px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none;box-shadow:inset 0 0 0 .5px var(--sep);transition:background .2s,color .2s}
.chip.on{background:var(--fg);color:var(--bg);box-shadow:none}
.chip svg.i{width:16px;height:16px}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:600;background:var(--fill);color:var(--fg-2);white-space:nowrap}
.tag svg.i{width:13px;height:13px;stroke-width:2.4}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.sky{background:var(--sky-soft);color:var(--sky)}
.tag.coral{background:var(--coral-soft);color:var(--coral)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.danger{background:var(--danger-soft);color:var(--danger)}
.tag.partner{background:var(--partner-soft);color:var(--partner)}
.btn{position:relative;height:52px;border-radius:26px;padding:0 22px;font-size:17px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn svg.i{width:19px;height:19px;stroke-width:2.3}
.btn.primary{background:var(--sky-fill);color:var(--on-sky);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 16px rgba(11,111,184,.28)}
.btn.coral{background:var(--coral-fill);color:var(--on-coral);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 16px rgba(244,122,78,.3)}
.btn.dark{background:var(--fg);color:var(--bg)}
.btn.soft{background:var(--fill);color:var(--fg)}
.btn.line{box-shadow:inset 0 0 0 1px var(--fill-2);color:var(--fg)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sm{height:36px;border-radius:18px;font-size:15px;width:auto;padding:0 15px}
.btn.sm svg.i{width:16px;height:16px}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;flex:none;line-height:1;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c))}
.avs{display:inline-flex;align-items:center}
.avs .av{box-shadow:0 0 0 2px var(--surface)}
.avs .av+.av{margin-left:-8px}
.seg{position:relative;display:flex;background:var(--fill);border-radius:20px;padding:3px;margin:4px 16px 0}
.seg button{flex:1;height:34px;border-radius:17px;font-size:14px;font-weight:600;text-align:center;color:var(--fg-2);transition:color .2s,background .25s,box-shadow .25s;white-space:nowrap;padding:0 6px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.1),inset 0 0 0 .5px var(--sep)}
.note{margin:12px 16px 0;padding:12px 14px;border-radius:18px;font-size:14px;line-height:1.5;display:flex;gap:10px;color:var(--fg-2);background:var(--fill)}
.note svg.i{width:18px;height:18px;flex:none;margin-top:1px}
.note b{color:var(--fg)}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.warn b{color:inherit}
.note.danger{background:var(--danger-soft);color:var(--danger)} .note.danger b{color:inherit}
.note.ok{background:var(--ok-soft);color:var(--ok)} .note.ok b{color:inherit}
.note.sky{background:var(--sky-soft);color:var(--sky)} .note.sky b{color:inherit}
.note.coral{background:var(--coral-soft);color:var(--coral)} .note.coral b{color:inherit}
.card{background:var(--surface);border-radius:24px;margin:12px 16px 0;padding:16px}
.card h4{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--fg-3);letter-spacing:.02em;text-transform:uppercase}
.card p{margin:0;font-size:15px;line-height:1.55}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--fill);border-radius:14px;padding:9px 10px}
.kv b{display:block;font:700 17px/1.2 var(--round);font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--fg-2)}
.stg{animation:rise 560ms var(--spring) both;animation-delay:calc(var(--i,0) * 36ms)}
.calm .stg{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:16px;background:var(--fill-2);transition:background .25s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .35s var(--overshoot)}
.switch input:checked+i{background:#34C759}
.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{outline:2.5px solid var(--sky);outline-offset:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--sky-fill) var(--p,50%),var(--fill-2) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-11px;box-shadow:0 2px 8px rgba(0,0,0,.2),inset 0 0 0 .5px rgba(0,0,0,.06)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--fill-2)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--sky-fill)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}

/* ── Sheets / toast ── */
.backdrop{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity 380ms;z-index:60}
.backdrop.in{opacity:1}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;max-height:calc(100% - var(--top) - 14px);border-radius:40px;z-index:61;
  transform:translateY(110%);transition:transform 520ms var(--spring);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 .6px var(--glass-edge),0 -10px 40px rgba(0,0,0,.18)}
.sheet.in{transform:none}
.sheet.large{top:calc(var(--top) + 6px)}
.grab{padding:8px 0 4px;flex:none}
.grab i{display:block;width:38px;height:5px;border-radius:3px;background:var(--fg-3);opacity:.45;margin:0 auto}
.sheet-head{display:flex;align-items:center;gap:10px;padding:2px 14px 6px;flex:none}
.sheet-head h3{flex:1;text-align:center;margin:0;font-size:17px;font-weight:600}
.sheet-head .cbtn{width:38px;height:38px;background:var(--fill)}
.sheet-head .cbtn svg.i{width:17px;height:17px}
.sheet-head .ghost{width:38px}
.sheet-body{overflow-y:auto;padding:6px 18px calc(var(--bottom) + 10px);scrollbar-width:none}
.sheet-body::-webkit-scrollbar{display:none}
.sheet-body .card,.sheet-body .note,.sheet-body .group{margin-left:0;margin-right:0}
.field{display:block;background:var(--surface);border-radius:18px;padding:10px 14px;margin-bottom:10px}
.field>span{display:block;font-size:12px;color:var(--fg-3);font-weight:600;margin-bottom:3px}
.field input,.field textarea,.field select{width:100%;border:0;background:none;outline:none;font-size:16px;padding:2px 0;resize:none}
.field textarea{min-height:66px;line-height:1.45}
.opt{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:12px 14px;margin-bottom:10px;width:100%;transition:box-shadow .2s}
.opt.on{box-shadow:inset 0 0 0 2px var(--sky)}
.opt .rt{flex:1;min-width:0}
.opt .rt b{display:block;font-weight:600;font-size:16px}
.opt .rt span{display:block;font-size:13px;color:var(--fg-2);margin-top:2px;line-height:1.4}
.toast{position:absolute;top:calc(var(--top) + 6px);left:50%;z-index:150;transform:translate(-50%,-24px) scale(.96);opacity:0;pointer-events:none;border-radius:24px;padding:11px 18px;display:flex;gap:8px;align-items:center;
  font-size:15px;font-weight:600;transition:transform 480ms var(--spring),opacity 280ms ease;white-space:nowrap;max-width:calc(100% - 32px)}
.toast.in{transform:translate(-50%,0);opacity:1}
.toast svg.i{width:18px;height:18px;color:var(--ok);stroke-width:2.6}
.toast span{overflow:hidden;text-overflow:ellipsis}

/* ── Trips home ── */
.hero-trip{position:relative;margin:4px 16px 0;border-radius:32px;overflow:hidden;color:#fff;min-height:268px;display:block;width:calc(100% - 32px);text-align:left;
  box-shadow:0 16px 36px rgba(11,80,140,.22)}
.hero-trip .art{position:absolute;inset:0}
.hero-trip .art svg{width:100%;height:100%;display:block}
.hero-trip .in{position:relative;padding:18px 18px 16px;display:flex;flex-direction:column;min-height:268px}
.hero-trip .kicker{font:600 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.hero-trip h2{font-size:28px;line-height:1.1;margin:8px 0 8px;letter-spacing:-.02em;text-shadow:0 2px 14px rgba(0,30,60,.35);max-width:88%;text-wrap:balance}
.hero-trip .meta{font-size:14px;display:flex;align-items:center;gap:6px;text-shadow:0 1px 8px rgba(0,30,60,.4)}
.hero-trip .bottom{margin-top:auto;display:flex;align-items:flex-end;gap:10px}
.hero-trip .count{flex:1}
.hero-trip .count b{font:700 44px/1 var(--round);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero-trip .count span{display:block;font-size:13px;opacity:.9;margin-top:2px}
.gl-chip{position:relative;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;font-size:14px;font-weight:600;color:#fff;
  background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 0 .6px rgba(255,255,255,.35)}
.gl-chip svg.i{width:16px;height:16px;stroke-width:2.4}
.progress{display:flex;gap:10px;align-items:center;margin:12px 16px 0;padding:14px 16px;background:var(--surface);border-radius:22px;width:calc(100% - 32px)}
.progress .bar{flex:1;height:8px;border-radius:4px;background:var(--fill-2);overflow:hidden}
.progress .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--sky-fill),var(--sky-light))}
.progress .rt{flex:1;min-width:0}
.progress .rt b{display:block;font-weight:600;font-size:16px}
.progress .rt span{display:block;font-size:13px;color:var(--fg-2);margin:2px 0 7px}
.tripcard{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:22px;padding:12px;margin:0 16px 10px;width:calc(100% - 32px);text-align:left}
.tripcard .th{width:64px;height:64px;border-radius:16px;flex:none;overflow:hidden;position:relative}
.tripcard .rt{flex:1;min-width:0}
.tripcard .rt b{display:block;font-weight:600;font-size:17px}
.tripcard .rt span{display:block;font-size:13px;color:var(--fg-2);margin-top:2px}
.tripcard .rt .tags{display:flex;gap:6px;margin-top:6px}
.webcard{margin:12px 16px 0;border-radius:22px;padding:12px 14px;display:flex;gap:12px;align-items:center;background:var(--sky-soft);width:calc(100% - 32px);text-align:left}
.webcard .ico{background:var(--sky-fill)}
.webcard .rt{flex:1}
.webcard b{display:block;font-size:15px;color:var(--sky)}
.webcard span{font-size:13px;color:var(--fg-2)}

/* ── Trip detail: map + timeline ── */
.trip-top{position:relative;flex:none;height:46%;min-height:300px;background:var(--map-land);overflow:hidden}
.trip-top .mapsvg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.trip-top .mapsvg:active{cursor:grabbing}
.trip-top .navbar{pointer-events:none}
.mapctl{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:5}
.mapctl .cbtn{width:42px;height:42px}
.mapbadge{position:absolute;left:12px;bottom:14px;z-index:5;border-radius:18px;padding:8px 12px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center;max-width:62%}
.mapbadge svg.i{width:15px;height:15px;color:var(--ok)}
.trip-body{flex:1;position:relative;overflow:hidden;background:var(--bg);margin-top:-22px;border-radius:26px 26px 0 0;box-shadow:0 -8px 24px rgba(0,30,60,.08);display:flex;flex-direction:column;z-index:2}
.trip-body .scroller{padding-top:0;padding-bottom:120px}
.trip-head{padding:16px 20px 6px}
.trip-head h1{font-size:24px;margin:0;letter-spacing:-.01em;line-height:1.2}
.trip-head p{margin:3px 0 0;font-size:14px;color:var(--fg-2)}
.daychips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 4px;scrollbar-width:none;flex:none}
.daychips::-webkit-scrollbar{display:none}
.daychip{flex:none;min-width:58px;height:54px;border-radius:18px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:inset 0 0 0 .5px var(--sep);transition:background .25s,color .25s,transform .25s var(--spring)}
.daychip i{font:700 11px/1 var(--mono);font-style:normal;letter-spacing:.06em;color:var(--fg-3)}
.daychip b{font:600 18px/1.1 var(--round)}
.daychip.on{background:var(--c);color:#fff;box-shadow:0 6px 14px color-mix(in srgb,var(--c) 40%,transparent)}
.daychip.on i{color:rgba(255,255,255,.85)}
.dayhead{display:flex;align-items:center;gap:10px;padding:14px 20px 4px}
.dayhead .rt{flex:1;min-width:0}
.dayhead b{display:block;font-size:18px;font-weight:700}
.dayhead span{font-size:13px;color:var(--fg-2)}
.dstats{display:flex;gap:6px;flex-wrap:wrap;padding:6px 20px 2px}
.tl{padding:6px 16px 0}
.stop{display:flex;gap:12px;align-items:stretch;width:100%;text-align:left;position:relative}
.stop .rail{width:30px;flex:none;display:flex;flex-direction:column;align-items:center}
.stop .pinno{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font:700 14px/30px var(--round);text-align:center;box-shadow:0 0 0 3px var(--bg),0 3px 8px color-mix(in srgb,var(--c) 45%,transparent);flex:none;z-index:1}
.stop .line{flex:1;width:0;border-left:2px dotted var(--fill-2);margin:2px 0 -2px}
.stop .body{flex:1;min-width:0;background:var(--surface);border-radius:20px;padding:11px 12px 11px 14px;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start;transition:box-shadow .25s}
.stop.hl .body{box-shadow:inset 0 0 0 2px var(--c)}
.stop .body .rt{flex:1;min-width:0}
.stop .t{font:600 13px/1.2 var(--round);color:var(--fg-2);font-variant-numeric:tabular-nums}
.stop .t em{font-style:normal;color:var(--fg-3);font-weight:500}
.stop h3{font-size:16px;font-weight:600;margin:2px 0 5px;line-height:1.25}
.stop .bdg{display:flex;flex-wrap:wrap;gap:5px}
.stop .tip{font-size:13px;color:var(--fg-2);margin-top:6px;line-height:1.4}
.stop .grip{display:flex;flex-direction:column;gap:2px;margin:-4px -4px 0 0}
.stop .grip button{width:30px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--fg-3)}
.stop .grip button:hover{background:var(--fill)}
.stop .grip svg.i{width:16px;height:16px;stroke-width:2.4}
.legrow{display:flex;gap:12px;align-items:center;min-height:30px}
.legrow .rail{width:30px;flex:none;align-self:stretch;display:flex;justify-content:center}
.legrow .rail i{border-left:2px dotted var(--fill-2)}
.legchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--fg-2);padding:4px 9px;border-radius:11px;background:var(--fill);margin:0 0 6px}
.legchip svg.i{width:14px;height:14px;stroke-width:2.2}
.legchip.metro{color:var(--sky);background:var(--sky-soft)}
.legchip.drive{color:var(--fg);background:var(--fill)}
.legchip.wait{background:none;color:var(--fg-3);font-weight:500}
.removed{display:flex;gap:10px;align-items:flex-start;background:var(--danger-soft);color:var(--danger);border-radius:18px;padding:11px 14px;margin:6px 16px 0;font-size:14px;line-height:1.45}
.removed svg.i{width:18px;height:18px;flex:none;margin-top:1px}
.removed b{display:block}
.optbar{position:absolute;left:12px;right:12px;bottom:var(--bottom);z-index:30;border-radius:30px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:10px;transition:transform .45s var(--spring),opacity .3s}
.optbar.hide{transform:translateY(140%);opacity:0;pointer-events:none}
.optbar .rt{flex:1;min-width:0;font-size:13px;line-height:1.3}
.optbar .rt b{display:block;font-size:14px}
.optbar .btn{width:auto}
.tabs2{display:flex;gap:6px;padding:10px 16px 4px;overflow-x:auto;scrollbar-width:none}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{height:34px;padding:0 13px;border-radius:17px;font-size:14px;font-weight:600;color:var(--fg-2);background:var(--fill);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs2 button.on{background:var(--fg);color:var(--bg)}
.tabs2 svg.i{width:15px;height:15px}

/* map svg layers */
.m-land{fill:var(--map-land)}
.m-water{fill:none;stroke:var(--map-water);stroke-linecap:round;stroke-linejoin:round}
.m-park{fill:var(--map-park)}
.m-road{fill:none;stroke:var(--map-road);stroke-linecap:round}
.m-ring{fill:none;stroke:var(--map-ring);stroke-width:5}
.m-label{font:600 10px var(--font);fill:var(--map-label);letter-spacing:.04em;text-transform:uppercase;paint-order:stroke;stroke:var(--map-land);stroke-width:3px}
.m-route{fill:none;stroke-linecap:round;stroke-linejoin:round}
.m-pin circle{transition:r .25s var(--spring)}
.m-pin text{font:700 11px var(--round);fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.m-sea{fill:var(--map-sea)}
.m-coast{fill:var(--map-coast);stroke:color-mix(in srgb,var(--map-water) 70%,var(--fg-3));stroke-width:.8}

/* ── Flights ── */
.fopt{display:block;width:calc(100% - 32px);margin:0 16px 10px;background:var(--surface);border-radius:24px;padding:14px;text-align:left;transition:box-shadow .2s}
.fopt.best{box-shadow:inset 0 0 0 2px var(--sky)}
.fopt .top{display:flex;gap:12px;align-items:center}
.fopt .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font:700 13px var(--round);flex:none}
.fopt .top .rt{flex:1;min-width:0}
.fopt .top b{display:block;font-size:16px;font-weight:600}
.fopt .top span{font-size:13px;color:var(--fg-2)}
.fopt .price{text-align:right}
.fopt .price b{font:700 18px var(--round)}
.fopt .price span{display:block;font-size:12px;color:var(--fg-3)}
.ftimes{display:flex;align-items:center;gap:10px;margin:12px 0 10px}
.ftimes .tm b{display:block;font:700 22px/1 var(--round);font-variant-numeric:tabular-nums}
.ftimes .tm span{font-size:12px;color:var(--fg-2)}
.ftimes .tm sup{font-size:11px;color:var(--coral);font-weight:700;margin-left:2px}
.ftimes .mid{flex:1;text-align:center;font-size:12px;color:var(--fg-3);position:relative}
.ftimes .mid i{display:block;height:2px;background:var(--fill-2);border-radius:1px;margin:6px 0;position:relative}
.ftimes .mid i::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 2px var(--fg-3);transform:translate(-50%,-50%)}
.fopt .chips2{display:flex;gap:6px;flex-wrap:wrap}
.ring{position:relative;width:46px;height:46px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 14px var(--round)}
.bars{display:grid;gap:8px}
.bars div{display:grid;grid-template-columns:118px 1fr 34px;gap:10px;align-items:center;font-size:13px;color:var(--fg-2)}
.bars i{height:7px;border-radius:4px;background:var(--fill-2);overflow:hidden;display:block}
.bars i s{display:block;height:100%;background:var(--sky-fill);border-radius:4px}
.bars em{font-style:normal;text-align:right;font:600 13px var(--round);color:var(--fg)}
.seatmap{position:relative;margin:4px auto 0;width:100%;max-width:320px}
.seatmap svg{width:100%;display:block}
.sunev{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.sunev+.sunev{border-top:.5px solid var(--sep)}
.sunev .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--coral-soft);color:var(--coral)}
.sunev .ic svg.i{width:20px;height:20px}
.sunev b{display:block;font-weight:600}
.sunev span{display:block;font-size:13px;color:var(--fg-2);line-height:1.45;margin-top:2px}
.jl{display:grid;gap:7px}
.jl .r{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;font-size:12px;color:var(--fg-2)}
.jl .track{position:relative;height:18px;border-radius:9px;background:var(--fill);overflow:hidden}
.jl .track s{position:absolute;top:0;bottom:0;border-radius:9px}
.jl .track s.seek{background:linear-gradient(90deg,#FFC66B,#F47A4E)}
.jl .track s.avoid{background:#1F3A5C}
.jl .track s.sleep{background:repeating-linear-gradient(135deg,var(--fill-2) 0 4px,transparent 4px 8px)}
.jl .axis{display:flex;justify-content:space-between;font:600 11px var(--mono);color:var(--fg-3);padding-left:72px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--fg-2);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.miniworld{border-radius:20px;overflow:hidden;background:var(--map-sea);margin-top:4px}
.miniworld svg{display:block;width:100%}

/* ── Hand-off review ── */
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;font-size:15px;line-height:1.4}
.check+.check{border-top:.5px solid var(--sep)}
.check .bx{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--ok-soft);color:var(--ok)}
.check .bx.q{background:var(--warn-soft);color:var(--warn)}
.check .bx svg.i{width:15px;height:15px;stroke-width:2.8}
.check span{display:block;font-size:13px;color:var(--fg-2)}
.prov{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:12px 14px;margin-bottom:8px;width:100%;text-align:left}
.prov.on{box-shadow:inset 0 0 0 2px var(--sky)}
.prov .rk{width:26px;height:26px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font:700 13px var(--round);flex:none}
.prov .rt{flex:1;min-width:0}
.prov .rt b{display:block;font-weight:600}
.prov .rt span{display:block;font-size:12px;color:var(--fg-2);margin-top:2px;line-height:1.35}
.prov .p{font:700 16px var(--round);white-space:nowrap}
.handoff{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:rgba(4,12,20,.6);opacity:0;transition:opacity .3s;pointer-events:none}
.handoff.in{opacity:1;pointer-events:auto}

/* ── Crew ── */
.mem{display:flex;gap:12px;align-items:center;padding:11px 16px;position:relative}
.mem+.mem::before{content:"";position:absolute;top:0;left:66px;right:0;height:.5px;background:var(--sep)}
.mem .rt{flex:1;min-width:0}
.mem .rt b{font-weight:600}
.mem .rt span{display:block;font-size:13px;color:var(--fg-2);margin-top:2px}
.arrivals{position:relative;height:96px;margin:6px 4px 4px}
.arrivals .ax{position:absolute;left:0;right:0;bottom:18px;height:2px;background:var(--fill-2)}
.arrivals .tick{position:absolute;bottom:0;font:600 11px var(--mono);color:var(--fg-3);transform:translateX(-50%)}
.arrivals .pt{position:absolute;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;white-space:nowrap}
.arrivals .meet{position:absolute;bottom:14px;top:0;border-left:2px dashed var(--coral);}
.arrivals .meet span{position:absolute;top:0;left:6px;font-size:11px;font-weight:700;color:var(--coral);white-space:nowrap}
.vote{display:flex;gap:10px;align-items:center;padding:10px 14px;position:relative}
.vote+.vote::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--sep)}
.vote .rt{flex:1;min-width:0}
.vote .rt b{font-weight:600;font-size:15px}
.vote .rt span{display:block;font-size:12px;color:var(--fg-2)}
.vote .vs{display:flex;gap:3px}
.vote .vbtn{width:36px;height:32px;border-radius:10px;background:var(--fill);display:grid;place-items:center;color:var(--fg-2)}
.vote .vbtn.on{background:var(--sky-fill);color:#fff}
.vote .vbtn.no.on{background:var(--danger);color:#fff}
.vote .vbtn svg.i{width:16px;height:16px;stroke-width:2.4}
.fair{display:grid;gap:9px}
.fair div{display:grid;grid-template-columns:30px 1fr 42px;gap:10px;align-items:center;font-size:13px}
.fair i{height:8px;border-radius:4px;background:var(--fill-2);overflow:hidden;display:block}
.fair i s{display:block;height:100%;border-radius:4px}
.fair em{font-style:normal;font:600 13px var(--round);text-align:right}

/* ── Explore ── */
.carousel{display:flex;gap:12px;overflow-x:auto;padding:4px 20px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.dest{position:relative;flex:none;width:250px;aspect-ratio:4/5;border-radius:28px;overflow:hidden;scroll-snap-align:center;color:#fff;text-align:left;box-shadow:0 10px 26px rgba(0,30,60,.16)}
.dest .art{position:absolute;inset:0}
.dest .art svg{width:100%;height:100%;display:block}
.dest .match{position:absolute;top:12px;left:12px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:14px;background:rgba(0,0,0,.2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 .6px rgba(255,255,255,.35)}
.dest .plate{position:absolute;left:10px;right:10px;bottom:10px;border-radius:22px;padding:12px 14px;background:rgba(255,255,255,.17);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 0 .6px rgba(255,255,255,.35)}
.dest .plate b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em;text-shadow:0 1px 8px rgba(0,0,0,.2)}
.dest .plate span{display:block;font-size:13px;opacity:.95;margin-top:4px;line-height:1.4}
.dest .plate em{display:block;font-style:normal;font-size:11px;font-weight:700;margin-top:6px;opacity:.9;letter-spacing:.04em;text-transform:uppercase}
.guide{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:22px;padding:13px;margin:0 16px 10px;width:calc(100% - 32px);text-align:left}
.guide .rt{flex:1;min-width:0}
.guide .rt b{display:block;font-weight:600;font-size:16px;line-height:1.3}
.guide .rt span{display:block;font-size:13px;color:var(--fg-2);margin-top:3px}
.guide .vl{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.v2badge{display:inline-flex;align-items:center;gap:5px;font:700 11px/1 var(--mono);letter-spacing:.08em;padding:5px 8px;border-radius:8px;background:var(--coral-soft);color:var(--coral);text-transform:uppercase}
.steps{counter-reset:s;display:grid;gap:10px}
.steps>div{display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:14px;line-height:1.45}
.steps>div::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--sky-soft);color:var(--sky);font:700 13px/28px var(--round);text-align:center}
.steps b{display:block}
.steps span{color:var(--fg-2);font-size:13px}
.mtable{width:100%;border-collapse:collapse;font-size:13px}
.mtable th,.mtable td{text-align:left;padding:8px 6px;border-bottom:.5px solid var(--sep);vertical-align:top;line-height:1.4}
.mtable th{font-size:11px;color:var(--fg-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.mtable td b{display:block;font-size:13px}

/* ── Memories ── */
.memcard{display:block;width:calc(100% - 32px);margin:0 16px 12px;border-radius:28px;overflow:hidden;position:relative;color:#fff;text-align:left;aspect-ratio:16/11;box-shadow:0 12px 28px rgba(0,30,60,.16)}
.memcard .art{position:absolute;inset:0}
.memcard .art svg{width:100%;height:100%;display:block}
.memcard .in{position:absolute;left:16px;right:16px;bottom:14px}
.memcard h3{font-size:26px;margin:0;letter-spacing:-.02em;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.memcard p{margin:4px 0 0;font-size:14px;opacity:.95}
.memcard .play{position:absolute;top:14px;right:14px}
.taste{display:grid;gap:10px}
.taste div{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;font-size:14px}
.taste i{height:8px;border-radius:4px;background:var(--fill-2);overflow:hidden;display:block}
.taste i s{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--coral-fill),var(--sun))}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;border-radius:18px;overflow:hidden}
.photos button{aspect-ratio:1;position:relative;overflow:hidden}
.photos button svg{width:100%;height:100%;display:block}
.photos button .ck{position:absolute;right:5px;bottom:5px;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #fff;background:rgba(0,0,0,.18);display:grid;place-items:center;color:#fff}
.photos button.on .ck{background:var(--sky-fill)}
.photos button .ck svg.i{width:13px;height:13px;stroke-width:3;opacity:0}
.photos button.on .ck svg.i{opacity:1}
.photos button.on::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--sky-fill)}
.player{position:absolute;inset:0;z-index:170;background:#000;color:#fff;opacity:0;transition:opacity .4s;overflow:hidden}
.player.in{opacity:1}
.player .slide{position:absolute;inset:0;opacity:0;transition:opacity .9s}
.player .slide.on{opacity:1}
.player .slide svg{position:absolute;inset:-6%;width:112%;height:112%;animation:kb 6s linear both}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.1) translate(-2%,-2%)}}
.player .cap{position:absolute;left:24px;right:24px;bottom:120px;text-shadow:0 2px 16px rgba(0,0,0,.5)}
.player .cap b{display:block;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.player .cap span{display:block;font-size:16px;margin-top:8px;opacity:.92;line-height:1.4}
.player .bars{position:absolute;top:calc(var(--top) + 8px);left:16px;right:16px;display:flex;gap:4px;z-index:2}
.player .bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.player .bars i s{display:block;height:100%;width:0;background:#fff}
.player .ctl{position:absolute;bottom:calc(var(--bottom) + 10px);left:16px;right:16px;display:flex;gap:10px;z-index:2}
.player .ctl .gl-chip{height:44px;flex:1;justify-content:center;font-size:15px}
.player .x{position:absolute;top:calc(var(--top) + 22px);right:14px;z-index:3}
.merch{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:20px;padding:10px 12px;margin-bottom:9px;width:100%;text-align:left}
.merch.on{box-shadow:inset 0 0 0 2px var(--sky)}
.merch .th{width:70px;height:70px;border-radius:14px;flex:none;overflow:hidden;background:var(--fill);display:grid;place-items:center}
.merch .th svg{width:100%;height:100%;display:block}
.merch .rt{flex:1;min-width:0}
.merch .rt b{display:block;font-weight:600}
.merch .rt span{display:block;font-size:12px;color:var(--fg-2);margin-top:2px;line-height:1.35}
.merch .p{font:700 16px var(--round)}
.passwrap{position:relative;border-radius:20px;overflow:hidden;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--sep)}
.passwrap svg{display:block;width:100%}
.redact{transition:opacity .5s,transform .5s var(--spring);transform-origin:left center}
.scanline{animation:scan 1.6s var(--out) both}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(190px)}}
.magnet-preview{display:grid;place-items:center;padding:16px 0 6px}
.magnet-preview svg{width:82%;filter:drop-shadow(0 12px 20px rgba(0,30,60,.25));transform:rotate(-3deg)}

/* ── Road trip ── */
.drivebar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--fill);margin-top:8px}
.drivebar s{display:block;height:100%}
.capline{position:relative}
.roadstop .pinno{border-radius:10px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 0;font-size:14px;line-height:1.45;color:var(--fg-2)}
.alert+.alert{border-top:.5px solid var(--sep)}
.alert .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.alert .ic svg.i{width:16px;height:16px;stroke-width:2.2}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rules div{background:var(--fill);border-radius:14px;padding:10px 11px;font-size:12px;color:var(--fg-2);line-height:1.4}
.rules b{display:block;font-size:14px;color:var(--fg);margin-bottom:2px}

/* ── Composer / AI build ── */
.typebox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.typebox button{background:var(--surface);border-radius:18px;padding:12px 10px;text-align:center;font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;transition:box-shadow .2s}
.typebox button.on{box-shadow:inset 0 0 0 2px var(--sky);color:var(--sky)}
.typebox svg.i{width:26px;height:26px}
.building{padding:6px 2px}
.bstep{display:flex;gap:12px;align-items:flex-start;padding:9px 0;opacity:.35;transition:opacity .35s}
.bstep.on,.bstep.done{opacity:1}
.bstep .dot{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--fill)}
.bstep.on .dot{background:var(--sky-soft)}
.bstep.on .dot::after{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--sky);border-top-color:transparent;animation:spin .8s linear infinite}
.bstep.done .dot{background:var(--ok-soft);color:var(--ok)}
.bstep .dot svg.i{width:14px;height:14px;stroke-width:3}
.bstep b{display:block;font-size:15px;font-weight:600}
.bstep span{display:block;font-size:13px;color:var(--fg-2);margin-top:1px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Trailer (pre-trip excitement) ── */
.trailer{position:absolute;inset:0;z-index:175;background:#03101D;color:#fff;opacity:0;transition:opacity .45s;overflow:hidden}
.trailer.in{opacity:1}
.trailer .globe{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%)}
.trailer .tcap{position:absolute;left:24px;right:24px;bottom:150px;text-align:center}
.trailer .tcap b{display:block;font-size:28px;letter-spacing:-.02em;line-height:1.15;transition:opacity .4s}
.trailer .tcap span{display:block;margin-top:8px;opacity:.85;font-size:15px}
.trailer .ctl{position:absolute;left:16px;right:16px;bottom:calc(var(--bottom) + 10px);display:flex;gap:10px}
.trailer .ctl .gl-chip{flex:1;justify-content:center;height:46px;font-size:15px}
.trailer .x{position:absolute;top:calc(var(--top) + 6px);right:14px;z-index:3}
.trailer .stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 20%,#fff6,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#fff5,transparent),radial-gradient(1px 1px at 85% 60%,#fff7,transparent),radial-gradient(1px 1px at 10% 70%,#fff5,transparent),radial-gradient(1px 1px at 55% 45%,#fff4,transparent)}
.daycards{position:absolute;left:0;right:0;top:calc(var(--top) + 60px);display:flex;justify-content:center}
.daycard{position:absolute;width:280px;border-radius:26px;padding:16px;background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 .6px rgba(255,255,255,.25);
  opacity:0;transform:translateY(30px) scale(.94);transition:opacity .6s,transform .7s var(--spring)}
.daycard.on{opacity:1;transform:none}
.daycard i{font:700 11px var(--mono);font-style:normal;letter-spacing:.12em;opacity:.8}
.daycard b{display:block;font-size:21px;margin:6px 0 8px;letter-spacing:-.01em}
.daycard div{font-size:14px;line-height:1.6;opacity:.92}

/* ── Onboarding ── */
.onb{position:absolute;inset:0;z-index:120;background:var(--bg);display:flex;flex-direction:column;transition:opacity .45s,transform .45s var(--spring)}
.onb.out{opacity:0;transform:scale(1.04);pointer-events:none}
.onb-step{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--top) + 18px) 22px calc(var(--bottom) + 8px);transition:transform 480ms var(--spring),opacity 300ms}
.onb-step.next{transform:translateX(100%);opacity:0;pointer-events:none}
.onb-step.prev{transform:translateX(-30%);opacity:0;pointer-events:none}
.onb-hero{margin:-18px -22px 0;padding:calc(var(--top) + 30px) 22px 26px;flex:1;display:flex;flex-direction:column;color:#fff;position:relative;overflow:hidden}
.onb-hero .art{position:absolute;inset:0}
.onb-hero .art svg{width:100%;height:100%;display:block}
.onb-hero .in{position:relative;margin-top:auto;text-shadow:0 2px 14px rgba(0,30,60,.35)}
.onb-hero h1{font-size:40px;line-height:1.04;margin:18px 0 10px;letter-spacing:-.03em}
.onb-hero p{font-size:16px;line-height:1.5;margin:0;opacity:.95}
.onb-hero .appicon{width:78px;height:78px;border-radius:20px;box-shadow:0 10px 30px rgba(0,30,60,.35)}
.onb h2{font-size:30px;margin:6px 0 6px;line-height:1.15;letter-spacing:-.02em}
.onb .lead{color:var(--fg-2);margin:0 0 16px;font-size:15px;line-height:1.5}
.onb .scroll{flex:1;overflow:auto;margin:0 -22px;padding:0 22px 10px;scrollbar-width:none}
.onb .scroll::-webkit-scrollbar{display:none}
.onb .back{margin-left:-8px;margin-bottom:4px;background:var(--fill)}
.onb .q{font-size:14px;font-weight:600;color:var(--fg-3);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 12px}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--fill-2);transition:width .3s,background .3s}
.dots i.on{width:20px;background:var(--sky-fill)}
.choice2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice2 button{background:var(--surface);border-radius:20px;padding:14px;text-align:left;transition:box-shadow .2s}
.choice2 button.on{box-shadow:inset 0 0 0 2px var(--coral-fill)}
.choice2 b{display:block;font-size:16px;margin-top:8px}
.choice2 span{display:block;font-size:12px;color:var(--fg-2);margin-top:2px}
.choice2 svg{width:42px;height:42px}
.promise{display:grid;gap:12px}
.promise div{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:flex-start;font-size:14px;line-height:1.45;color:var(--fg-2)}
.promise b{display:block;color:var(--fg);font-size:15px}
.promise .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--sky-soft);color:var(--sky)}
.promise .ic svg.i{width:19px;height:19px}

@media (prefers-reduced-motion:reduce){
  /* no sliding or zooming — drill-ins and steps cross-fade instead; position changes are instant */
  .push{transform:none;opacity:0;transition:opacity 220ms ease}
  .push.in{opacity:1}
  .under{transform:none;filter:none}
  .onb-step.next,.onb-step.prev{transform:none}
  .sheet,.toast,.dock,.lens,.optbar,.daycard,.redact{transition-duration:1ms!important}
  .stg{animation:fadein .3s both}
  .player .slide svg,.scanline,.lens.squish i{animation:none}
  @keyframes fadein{from{opacity:0}}
}

/* ════════════ Anywhere-inspired V1 (2026-11) ════════════ */
.toast.act{pointer-events:auto;padding-right:7px}
.toast .tact{margin-left:4px;height:32px;padding:0 14px;border-radius:16px;background:var(--fill);color:var(--sky);font-weight:700;font-size:14px;flex:none}
.tag.src{gap:5px}
.tag.src .av{font-size:9px;box-shadow:none}
.tag.src.ai{background:var(--coral-soft);color:var(--coral)}
.histbtn{display:inline-flex;align-items:center;gap:3px;color:var(--sky);font-weight:600;font-size:inherit}
.histbtn svg.i{width:14px;height:14px}
.tips{margin:12px 0 2px}
.tipsrow{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 16px 6px;scrollbar-width:none}
.tipsrow::-webkit-scrollbar{display:none}
.tipcard{flex:0 0 80%;scroll-snap-align:center;position:relative;border-radius:22px;background:var(--surface);padding:14px 14px 14px;display:flex;flex-direction:column;gap:5px;box-shadow:inset 0 0 0 .5px var(--sep)}
.tipcard .ico{width:34px;height:34px;border-radius:11px;background:var(--sky-soft);color:var(--sky);display:grid;place-items:center}
.tipcard .ico svg.i{width:18px;height:18px}
.tipcard b{font-size:16px;padding-right:24px}
.tipcard>span:not(.ico){font-size:13px;color:var(--fg-2);line-height:1.4}
.tipcard .btn{align-self:flex-start;margin-top:4px}
.tipcard .x{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--fg-2)}
.tipcard .x svg.i{width:13px;height:13px}
.tipsoff{display:block;margin:2px auto 0;font-size:13px;color:var(--fg-3);padding:4px 8px}
.saved{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:20px;background:var(--surface);margin-bottom:10px}
.saved .rt{flex:1;min-width:0}
.saved .rt>b{display:block;font-size:16px}
.saved .rt>span{display:block;font-size:13px;color:var(--fg-2);margin-top:2px}
.saved .wrapchips{margin-top:8px;gap:6px}
.pnote{margin:9px 0 0;font-size:14px;color:var(--fg);font-style:italic;line-height:1.45}
.saved .act{flex:none}
.bubble{max-width:86%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.45;margin:12px 0 0;width:fit-content}
.bubble.me{margin-left:auto;background:var(--sky-fill);color:var(--on-sky);border-bottom-right-radius:6px}
.bubble.ai{background:var(--fill);color:var(--fg);border-bottom-left-radius:6px;display:flex;gap:8px}
.bubble.ai svg.i{flex:none;color:var(--coral);width:18px;height:18px;margin-top:2px}
.aicard{padding:13px 14px;border-radius:18px;background:var(--surface);margin:10px 0 0;box-shadow:inset 0 0 0 .5px var(--sep)}
.aicard b{display:block;font-size:16px}
.aicard p{margin:4px 0 10px;font-size:13px;color:var(--fg-2);line-height:1.45}
.aicard .foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.aicard .foot small{font-size:12px;color:var(--fg-3);line-height:1.35}
.logrow{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:.5px solid var(--sep)}
.logrow .rt{flex:1;min-width:0}
.logrow .rt b{display:block;font-size:14px}
.logrow .rt span{display:block;font-size:14px;color:var(--fg-2);line-height:1.4}
.logrow .rt em{font-style:normal;font-size:12px;color:var(--fg-3)}
.logrow .ico svg.i{width:16px;height:16px}
.notif{position:absolute;left:8px;right:8px;top:calc(var(--top) + 2px);z-index:170;display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:26px;text-align:left;transform:translateY(-160%);transition:transform .55s var(--spring, cubic-bezier(.2,.9,.25,1.1))}
.notif.in{transform:none}
.notif .pi{flex:none;line-height:0}
.notif .pi svg{width:38px;height:38px;border-radius:10px}
.notif .rt{flex:1;min-width:0}
.notif b{display:flex;justify-content:space-between;font-size:12px;color:var(--fg-2);font-weight:600;letter-spacing:.02em}
.notif b em{font-style:normal;font-weight:500}
.notif strong{display:block;font-size:15px;margin-top:2px;color:var(--fg)}
.notif .rt>span{display:block;font-size:14px;color:var(--fg-2);line-height:1.35;margin-top:1px}

/* ── 2026-11 polish: one scale for edges and shadows, quieter chrome, larger hit areas ── */
:root{--edge:inset 0 0 0 .5px var(--sep);--sh-1:0 1px 2px rgba(10,40,80,.06),0 1px 1px rgba(10,40,80,.04);--sh-2:0 8px 24px rgba(10,40,80,.12);--avoid:#1F3A5C;--lens:rgba(11,111,184,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh-1:0 0 0 .5px rgba(255,255,255,.06);--sh-2:0 8px 24px rgba(0,0,0,.45);--avoid:#6B8FC7;--lens:rgba(108,192,245,.22)}}
:root[data-theme="dark"]{--sh-1:0 0 0 .5px rgba(255,255,255,.06);--sh-2:0 8px 24px rgba(0,0,0,.45);--avoid:#6B8FC7;--lens:rgba(108,192,245,.22)}
.card,.group,.stop .body,.fopt,.tripcard,.progress{box-shadow:var(--edge),var(--sh-1)}
.stop.hl .body{box-shadow:inset 0 0 0 2px var(--c),var(--sh-1)}
.tab{color:var(--fg-2)}
.tab.on{color:var(--sky)}
.fab{background:color-mix(in srgb,var(--sky-fill) 92%,transparent);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),var(--sh-2)}
.jl .track s.avoid{background:var(--avoid)}
.tag.more{background:none;box-shadow:inset 0 0 0 1px var(--fill-2);color:var(--fg-3);padding:0 7px}
.stop .grip{gap:6px}
.stop .grip button,.tipcard .x,.vote .vbtn,.tag.sky,.histbtn,.tipsoff,.toast .tact{position:relative}
.stop .grip button::after,.tipcard .x::after,.vote .vbtn::after,button.tag.sky::after,.histbtn::after,.tipsoff::after,.toast .tact::after{content:"";position:absolute;inset:-8px -6px}

/* ════════════ Seat view (window preview) ════════════ */
.sv{position:absolute;inset:0;overflow:hidden;background:var(--sv-bg);
  --sv-bg:#F1F1EF;--sv-fus:#FFFFFF;--sv-seat:#FFFFFF;--sv-tk:#CBCBC8;--sv-tick:#AEBBD0;--sv-wing:#FAFAF8;--sv-wing2:#E9E9E6;--sv-ink:#111315;--sv-on:#FFFFFF;
  --wall:rgb(203,196,187);--shade:0;--wing:0;--sx:50%;--sy:40%;--glow:0;--wg1:#DADDE2;--wg2:#A9AFB8;--wg3:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sv{--sv-bg:#0A0F15;--sv-fus:#16202B;--sv-seat:#2C3A4B;--sv-tk:#111922;--sv-tick:#4E6A8C;--sv-wing:#131C26;--sv-wing2:#0E151D;--sv-ink:#EEF4FA;--sv-on:#0A1A2A}}
:root[data-theme="dark"] .sv{--sv-bg:#0A0F15;--sv-fus:#16202B;--sv-seat:#2C3A4B;--sv-tk:#111922;--sv-tick:#4E6A8C;--sv-wing:#131C26;--sv-wing2:#0E151D;--sv-ink:#EEF4FA;--sv-on:#0A1A2A}
.sv-head{position:absolute;top:calc(var(--top) + 4px);left:16px;right:16px;z-index:30;display:flex;align-items:center;gap:13px;color:var(--fg);transition:color .4s}
.sv-head h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.sv-head p{margin:3px 0 0;font:500 11px/1.2 var(--mono);color:color-mix(in srgb,currentColor 60%,transparent);white-space:nowrap}
.sv-bk{background:var(--surface);color:var(--fg);box-shadow:0 4px 14px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.05)}
.sv:not([data-view=map]) .sv-head{color:#17191C}
.sv.night:not([data-view=map]) .sv-head{color:#fff}
.sv:not([data-view=map]) .sv-bk{background:rgba(255,255,255,.92);color:#17191C}

/* seat map */
.sv-map{position:absolute;inset:0;transition:opacity .25s}
.sv:not([data-view=map]) .sv-map{opacity:0;pointer-events:none}
.sv-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(var(--top) + 62px) 0 300px;scrollbar-width:none;overscroll-behavior:contain}
.sv-scroll::-webkit-scrollbar{display:none}
.sv-plane{position:relative}
.sv-fus{position:relative;z-index:2;width:232px;margin:0 auto;padding:8px 5px 70px;background:var(--sv-fus);border-radius:116px 116px 46px 46px/170px 170px 46px 46px;
  box-shadow:0 0 0 .5px rgba(0,0,0,.05),0 18px 40px rgba(20,30,40,.10),inset 0 0 0 5px color-mix(in srgb,var(--sv-fus) 92%,#8090A0)}
.sv-nose{height:76px;display:grid;place-items:end center;padding-bottom:16px}
.sv-nose span{font:600 9px/1 var(--mono);letter-spacing:.32em;color:var(--fg-3);opacity:.7;padding:6px 14px;border-radius:6px;background:var(--fill)}
.sv-letters,.sv-row{display:grid;grid-template-columns:4px repeat(3,25px) 34px repeat(3,25px) 4px;gap:4px;justify-content:center;align-items:center}
.sv-letters{height:18px;padding:0 8px;grid-template-columns:repeat(3,25px) 34px repeat(3,25px)}
.sv-letters b{font:600 9px/1 var(--mono);color:var(--fg-3);text-align:center}
.sv-row{height:32px}
.sv-row s{width:4px;height:14px;border-radius:2px;background:var(--sv-tick)}
.sv-row s.none{background:none;box-shadow:inset 0 0 0 .75px color-mix(in srgb,var(--sv-tick) 60%,transparent)}
.sv-no{font:600 10px/1 var(--mono);color:var(--fg-3);text-align:center}
.sv-seat{position:relative;width:25px;height:25px;border-radius:7px;background:var(--sv-seat);box-shadow:0 1px 2px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.07);transition:background .25s,transform .25s var(--overshoot)}
.sv-seat::before{content:"";position:absolute;inset:-4px}
.sv-seat i{position:absolute;left:0;right:0;bottom:0;height:8px;border-radius:0 0 7px 7px;background:rgba(0,0,0,.075)}
.sv-seat.tk{background:var(--sv-tk);box-shadow:none;cursor:default}
.sv-seat.on{background:var(--coral-fill);box-shadow:0 3px 10px rgba(244,122,78,.45)}
.sv-seat.kept{box-shadow:0 0 0 2px var(--coral-fill)}
.sv-seat.pop{animation:svPop .5s var(--overshoot)}
.sv-seat.pop::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid rgba(120,120,128,.5);animation:svRing .6s ease-out both}
@keyframes svPop{0%{transform:scale(.82)}55%{transform:scale(1.14)}100%{transform:none}}
@keyframes svRing{from{opacity:1;transform:scale(.5)}to{opacity:0;transform:scale(1.5)}}
.sv-tail{height:0}
.sv-wing{position:absolute;top:var(--wt);height:var(--wh);width:calc(50% - 100px);z-index:1;background:linear-gradient(180deg,var(--sv-wing),var(--sv-wing2))}
.sv-wing.l{left:0;clip-path:polygon(100% 0,100% 58%,0 100%,0 44%)}
.sv-wing.r{right:0;clip-path:polygon(0 0,100% 44%,100% 100%,0 58%)}
.sv-eng{position:absolute;top:calc(var(--wt) - 22px);width:30px;height:78px;border-radius:13px 13px 9px 9px;z-index:1;background:linear-gradient(90deg,var(--sv-wing),var(--sv-wing2));box-shadow:0 8px 16px rgba(20,30,40,.10),0 0 0 .5px rgba(0,0,0,.05)}
.sv-eng.l{left:calc(50% - 196px)}.sv-eng.r{right:calc(50% - 196px)}
.sv-fog{position:absolute;left:0;right:0;bottom:0;height:48%;pointer-events:none;z-index:3}
.sv-fog i{position:absolute;inset:0;-webkit-backdrop-filter:blur(1.2px);backdrop-filter:blur(1.2px);-webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%)}
.sv-fog i:nth-child(2){-webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px);-webkit-mask-image:linear-gradient(transparent 30%,#000 70%);mask-image:linear-gradient(transparent 30%,#000 70%)}
.sv-fog i:nth-child(3){-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);-webkit-mask-image:linear-gradient(transparent 55%,#000 90%);mask-image:linear-gradient(transparent 55%,#000 90%)}

/* the wall you get instead of a window */
.sv-wall,.sv-win{position:absolute;inset:0;opacity:0;pointer-events:none}
.sv-wall{bottom:150px}
.sv-wallsvg{width:100%;height:100%;display:block}
.sv[data-view=wall] .sv-wall,.sv[data-view=window] .sv-win{opacity:1;pointer-events:auto}

/* the window */
.sv-win{background:linear-gradient(180deg,color-mix(in srgb,var(--wall) 90%,#fff),var(--wall) 42%,color-mix(in srgb,var(--wall) 90%,#000))}
.sv-port{position:absolute;left:50%;top:calc(var(--top) + 86px);height:min(43%,calc(100% - 420px));aspect-ratio:625/795;transform:translateX(-50%)}
.sv-recess{position:absolute;inset:-17% -27% -13%;border-radius:46%/36%;background:linear-gradient(180deg,color-mix(in srgb,var(--wall) 84%,#fff),color-mix(in srgb,var(--wall) 95%,#fff));
  box-shadow:inset 0 3px 5px rgba(255,255,255,.5),inset 0 -8px 16px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.035),0 16px 34px rgba(0,0,0,.07)}
.sv-ring{position:absolute;inset:-12.5% -8.5% -6%;border-radius:42%/33%;
  background:linear-gradient(180deg,color-mix(in srgb,var(--wall) 78%,#000) 0,color-mix(in srgb,var(--wall) 93%,#000) 15%,color-mix(in srgb,var(--wall) 80%,#fff) 72%);
  box-shadow:inset 0 7px 14px rgba(0,0,0,.17),inset 0 -2px 3px rgba(255,255,255,.45),0 1px 0 rgba(255,255,255,.55)}
.sv-lip{position:absolute;left:27%;right:27%;top:-7.4%;height:3.5%;border-radius:99px;z-index:4;cursor:grab;touch-action:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--wall) 68%,#fff),color-mix(in srgb,var(--wall) 92%,#fff));box-shadow:0 2px 5px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.65)}
.sv-lip::before{content:"";position:absolute;inset:-14px -10px}
.sv-glass{position:absolute;inset:0;border-radius:37%/29%;overflow:hidden;background:#05070C;isolation:isolate;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--wall) 70%,#fff),0 0 0 4.5px rgba(0,0,0,.07),0 6px 14px rgba(0,0,0,.10)}
.sv-cv{display:block;width:100%;height:100%}
.sv-glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 12px 24px rgba(0,0,0,.30),inset 0 0 0 1.5px rgba(255,255,255,.10);
  background:linear-gradient(118deg,rgba(255,255,255,.10),transparent 26%,transparent 74%,rgba(255,255,255,.05))}
.sv-wingov{position:absolute;left:-4%;right:-4%;bottom:-3%;height:44%;opacity:var(--wing);transform:translateY(calc((1 - var(--wing))*28%));pointer-events:none}
.sv-wingov svg{width:100%;height:100%;display:block}
.sv-shade{position:absolute;left:0;right:0;top:0;height:calc(var(--shade)*100%);cursor:grab;touch-action:none;transition:height .5s var(--spring);
  background:radial-gradient(70% 36% at var(--sx) calc(var(--sy)/max(var(--shade),.05)),rgba(255,204,138,calc(var(--glow)*.9)),transparent),linear-gradient(180deg,color-mix(in srgb,var(--wall) 45%,#F4EEE2),color-mix(in srgb,var(--wall) 55%,#EAE1D2));
  box-shadow:0 4px 10px rgba(0,0,0,.28)}
.sv-shade i{position:absolute;left:50%;bottom:7px;width:54px;height:5px;margin-left:-27px;border-radius:3px;background:rgba(0,0,0,.16)}
.sv:not(.shaded) .sv-shade{pointer-events:none}
.sv.dragshade .sv-shade{transition:none}
.sv-tip{position:absolute;left:50%;top:-10%;z-index:6;transform:translate(-50%,6px);opacity:0;transition:opacity .3s,transform .3s var(--spring);pointer-events:none;white-space:nowrap;
  background:rgba(22,22,24,.88);color:#fff;font:600 11px/1 var(--font);padding:8px 12px;border-radius:99px}
.sv.tip .sv-tip{opacity:1;transform:translate(-50%,0)}

/* view ↔ map: a zoom through the cabin */
.sv.to-view .sv-map{animation:svOut .62s cubic-bezier(.55,0,.9,.35) both;transform-origin:var(--ox,50%) var(--oy,50%)}
.sv.to-view[data-view=wall] .sv-wall,.sv.to-view[data-view=window] .sv-win{animation:svIn .82s .34s cubic-bezier(.16,.84,.3,1) both}
.sv.to-map[data-from=wall] .sv-wall,.sv.to-map[data-from=window] .sv-win{animation:svLeave .5s cubic-bezier(.55,0,.9,.35) both}
.sv.to-map .sv-map{animation:svBack .8s .3s cubic-bezier(.16,.84,.3,1) both;transform-origin:var(--ox,50%) var(--oy,50%)}
@keyframes svOut{0%{opacity:1;transform:perspective(900px) scale(1);filter:blur(0)}60%{opacity:1}100%{opacity:0;transform:perspective(900px) rotateX(34deg) scale(6.5);filter:blur(16px)}}
@keyframes svIn{0%{opacity:0;transform:scale(1.9);filter:blur(22px)}45%{opacity:1}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes svLeave{0%{opacity:1;transform:none;filter:blur(0)}100%{opacity:0;transform:scale(1.8);filter:blur(20px)}}
@keyframes svBack{0%{opacity:0;transform:scale(5);filter:blur(16px)}45%{opacity:1}100%{opacity:1;transform:none;filter:blur(0)}}

/* sheet */
.sv-sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;background:var(--surface);color:var(--fg);border-radius:28px 28px 0 0;padding:24px 22px calc(var(--bottom) + 6px);
  box-shadow:0 -12px 40px rgba(0,0,0,.09);min-height:196px;transition:min-height .5s var(--spring)}
.sv[data-view=wall] .sv-sheet{min-height:238px}.sv[data-view=window] .sv-sheet{min-height:300px}
.sv-sheet>*{transition:opacity .17s,transform .17s}
.sv-sheet.out>*{opacity:0;transform:translateY(5px)}
.sv-sheet h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
.sv-lead{margin:5px 0 0;font-size:15px;color:var(--fg-3)}
.sv-sheet h3{margin:8px 0 0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.sv-sid,.sv-time{display:flex;align-items:baseline;gap:10px}
.sv-sid b{font:600 40px/1 var(--mono);letter-spacing:-.04em}
.sv-time b{font:600 38px/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sv-sid span,.sv-time span{font-size:13px;color:var(--fg-3)}
.sv-play{margin-left:auto;align-self:center;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--fg)}
.sv-play svg.i{width:16px;height:16px}
.sv-sub{display:flex;align-items:center;gap:8px;margin:6px 0 0;font-size:13px;color:var(--fg-2)}
.sv-sub i{width:8px;height:8px;border-radius:50%;flex:none;transition:background .4s}
.d-day{background:#9DBEF2}.d-low{background:#F2C24B}.d-set{background:#F28A3C}.d-dusk{background:#6A66B4}.d-night{background:#232A5C}.d-off{background:#B7B7B3}
.swap{animation:svSwap .28s var(--out)}
@keyframes svSwap{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sv-tl{position:relative;height:56px;margin:18px 6px 2px;touch-action:none;cursor:pointer;border-radius:8px}
.sv-track{position:absolute;left:0;right:0;top:12px;height:5px;border-radius:3px}
.sv-stop{position:absolute;top:9.5px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.2)}
.sv-thumb{position:absolute;top:14.5px;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.08);transition:box-shadow .2s,transform .2s var(--spring)}
.sv-tl.drag .sv-thumb{box-shadow:0 2px 10px rgba(0,0,0,.3),0 0 0 11px rgba(120,120,128,.2);transform:scale(1.06)}
.sv-labels button{position:absolute;top:30px;transform:translateX(-50%);font:500 10px/1 var(--mono);color:var(--fg-3);padding:7px 4px;white-space:nowrap}
.sv-labels button.first{transform:none;margin-left:-6px}
.sv-btns{display:flex;gap:10px;margin-top:20px}.sv-btns.two>*{flex:1;padding:0 10px}
.sv-btn{height:52px;border-radius:26px;padding:0 22px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;white-space:nowrap;transition:background .4s,color .4s,transform 180ms var(--spring)}
.sv-btn.dark{background:var(--sv-ink);color:var(--sv-on)}.sv-btn.soft{background:var(--fill)}.sv-btn.wide{width:100%;margin-top:4px}
.sv-btn em{font-style:normal;font-weight:500;font-size:13px;opacity:.55}
.sv-btn.kept{background:var(--coral-fill);color:#fff}.sv-btn svg.i{width:18px;height:18px;stroke-width:2.4}
.sv-fine{display:flex;align-items:center;gap:6px;margin:12px 0 0;font-size:11px;line-height:1.45;color:var(--fg-3)}
.sv-fine.c{justify-content:center;text-align:center}.sv-fine svg.i{width:14px;height:14px;color:var(--ok)}
.sv-legend{display:flex;gap:14px;margin-top:16px;font-size:12px;color:var(--fg-2)}
.sv-legend span{display:flex;align-items:center;gap:6px}
.sv-legend i{width:13px;height:13px;border-radius:4px}.sv-legend i.f{background:var(--sv-seat);box-shadow:0 0 0 .75px rgba(0,0,0,.18)}.sv-legend i.t{background:var(--sv-tk)}.sv-legend i.o{background:var(--coral-fill)}
.sv-legend s{width:4px;height:13px;border-radius:2px;background:var(--sv-tick)}
@media (prefers-reduced-motion:reduce){.sv.to-view .sv-map,.sv.to-view .sv-wall,.sv.to-view .sv-win,.sv.to-map .sv-map,.sv.to-map .sv-wall,.sv.to-map .sv-win{animation-duration:.01s;animation-delay:0s}}

/* entry card on the flight screen */
.svcta{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:12px;border-radius:18px;background:var(--fill);text-align:left}
.svcta .rt{flex:1;min-width:0}.svcta b{display:block;font-size:15px;font-weight:600}.svcta .rt span{display:block;font-size:12px;color:var(--fg-2);line-height:1.4;margin-top:2px}
.svcta-w{flex:none;width:40px;height:50px;border-radius:15px/17px;background:#D9D2C7;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.svcta-w i{width:26px;height:35px;border-radius:10px/12px;background:linear-gradient(180deg,#3B5FA8,#F2A257 62%,#E9E1D3 63%);box-shadow:0 0 0 2px #EFE9DF}

/* ── three vehicles, one screen ── */
.sv-modes{margin:-4px 0 16px}
.sv-modes button{display:flex;align-items:center;justify-content:center;gap:6px}
.sv-modes svg.i{width:16px;height:16px}
.sv-warn{display:flex;align-items:center;gap:7px;margin:8px 0 0;padding:7px 10px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600}
.sv-warn svg.i{width:15px;height:15px;flex:none}
.sv-cap{position:absolute;left:0;right:0;top:calc(100% + 34px);margin:0;text-align:center;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#17191C;opacity:.5;transition:color .4s}
.sv.night .sv-cap{color:#fff}
.sv[data-mode=air] .sv-cap,.sv-bolts,.sv-boat{display:none}
.sv-car{display:none}
.sv-row s.boat,.sv-legend s.boat{width:6px;height:22px;border-radius:3px;background:var(--coral-fill);margin:0 -1px}
.sv-legend s.boat{height:13px;width:5px;margin:0}

/* rail car: 3 + 2, one window per row, the next cars peeking in at both ends */
.sv[data-mode=rail] .sv-fus{border-radius:30px;padding:8px 5px 26px;margin-top:26px}
.sv[data-mode=rail] .sv-nose,.sv[data-mode=sea] .sv-nose{height:46px;padding-bottom:10px}
.sv[data-mode=rail] .sv-row{grid-template-columns:4px repeat(3,25px) 34px repeat(2,25px) 4px;column-gap:9px;row-gap:0}
.sv[data-mode=rail] .sv-letters{grid-template-columns:repeat(3,25px) 34px repeat(2,25px);column-gap:9px}
.sv[data-mode=rail] .sv-car{display:block;position:absolute;left:50%;width:232px;height:120px;margin-left:-116px;border-radius:30px;background:var(--sv-fus);opacity:.55;box-shadow:0 0 0 .5px rgba(0,0,0,.05)}
.sv[data-mode=rail] .sv-car.prev{top:-108px}.sv[data-mode=rail] .sv-car.next{bottom:-134px}
/* deck plan: outside cabins on the hull, inside cabins on the corridor, lifeboats hanging where they block a window */
.sv[data-mode=sea] .sv-fus{border-radius:116px 116px 34px 34px/210px 210px 34px 34px;padding:8px 5px 34px}
.sv[data-mode=sea] .sv-nose{height:104px}
.sv[data-mode=sea] .sv-row{grid-template-columns:4px 46px 34px 30px 34px 46px 4px;height:38px}
.sv[data-mode=sea] .sv-letters{grid-template-columns:84px 30px 84px;padding:0}
.sv[data-mode=sea] .sv-seat{width:auto;height:31px;border-radius:6px}
.sv[data-mode=sea] .sv-seat.in{background:color-mix(in srgb,var(--sv-seat) 62%,var(--sv-tk))}
.sv[data-mode=sea] .sv-seat.in.tk,.sv[data-mode=sea] .sv-seat.tk{background:var(--sv-tk)}
.sv[data-mode=sea] .sv-seat.on{background:var(--coral-fill)}
.sv-seat b{font:600 9px/31px var(--mono);color:var(--fg-2);display:block;text-align:center}
.sv-seat.tk b{opacity:.45}.sv-seat.on b{color:#fff}

/* train window: a wide pane with a roller blind */
.sv[data-mode=rail] .sv-port{width:86%;height:auto;aspect-ratio:1.5;top:calc(var(--top) + 118px)}
.sv[data-mode=rail] .sv-glass{border-radius:24px}
.sv[data-mode=rail] .sv-ring{inset:-9% -4.5% -8%;border-radius:36px}
.sv[data-mode=rail] .sv-recess{inset:-20% -9% -34%;border-radius:44px}
.sv[data-mode=rail] .sv-lip{left:39%;right:39%;top:-6.6%;height:5%}
.sv[data-mode=rail] .sv-tip{top:-17%}
/* porthole */
.sv[data-mode=sea] .sv-port{width:76%;height:auto;aspect-ratio:1;top:calc(var(--top) + 100px)}
.sv[data-mode=sea] .sv-glass{border-radius:50%}
.sv[data-mode=sea] .sv-ring{inset:-9.5%;border-radius:50%;background:linear-gradient(160deg,color-mix(in srgb,var(--wall) 60%,#fff),color-mix(in srgb,var(--wall) 82%,#000));box-shadow:inset 0 2px 3px rgba(255,255,255,.6),inset 0 -3px 6px rgba(0,0,0,.2),0 8px 20px rgba(0,0,0,.16)}
.sv[data-mode=sea] .sv-recess{inset:-17%;border-radius:50%}
.sv[data-mode=sea] .sv-bolts{display:block;position:absolute;inset:-8%;width:116%;height:116%;fill:color-mix(in srgb,var(--wall) 62%,#000);pointer-events:none;z-index:2}
.sv[data-mode=sea] .sv-lip,.sv[data-mode=sea] .sv-tip,.sv[data-mode=sea] .sv-shade,.sv[data-mode=rail] .sv-wingov,.sv[data-mode=sea] .sv-wingov{display:none}
.sv[data-mode=sea].obst .sv-boat{display:block;position:absolute;inset:0;filter:brightness(var(--dim,1))}
.sv-boat svg{width:100%;height:100%;display:block}

/* photographs for the demo flight sit over the drawn scene; where a chapter has no photo the drawn scene shows through */

const RAD = Math.PI / 180, DEG = 180 / Math.PI, R_EARTH = 6371;

const WORLD = GEO_DATA.world.split('|').map(p => p.split(';').map(r => r.split(' ').map(q => q.split(',').map(Number))));

/* Plain equirectangular path (used for the icon; skips antimeridian jumps) */
function equirectPath(w, h, lon0 = 0) {
  let d = '';
  for (const poly of WORLD) for (const ring of poly) {
    let prev = null;
    ring.forEach(([lo, la], i) => {
      let l = lo - lon0; if (l < -180) l += 360; if (l > 180) l -= 360;
      const x = (l + 180) / 360 * w, y = (90 - la) / 180 * h;
      d += (i === 0 || (prev && Math.abs(prev - x) > w / 2)) ? `M${x.toFixed(1)} ${y.toFixed(1)}` : `L${x.toFixed(1)} ${y.toFixed(1)}`;
      prev = x;
    });
    d += 'Z';
  }
  return d;
}
