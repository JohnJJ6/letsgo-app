/* ── Trip model: computes each day from the engine (opening hours, sun times, user order) ── */
function sunFor(date) { return sunTimes(date, PARIS.off, PARIS.center[0], PARIS.center[1]) }
function dayStops(di) {
  const day = TRIP_PARIS.days[di];
  let ids = day.stops.concat(S.added[di] || []).concat(Object.keys(S.moved).filter(k => S.moved[k] === di));
  ids = ids.filter((id, i) => (!(id in S.moved) || S.moved[id] === di) && ids.indexOf(id) === i);
  const removed = [], keep = [];
  const st = sunFor(day.date);
  ids.forEach(id => {
    const p = PLACES[id];
    if (p.closedNote) { removed.push({ id, why: T(p.closedNote), alt: id === 'pompidou' ? 'bourse' : null }); return }
    if (p.hours && !(p.hours[day.dow] || []).length) { removed.push({ id, why: L(`Closed on ${dowName(day.dow)}`, `${dowName(day.dow)}不开门`), move: true }); return }
    const s = { id, ll: p.ll, dur: p.dur, hours: p.hours, window: p.window };
    if (p.sun === 'rise') s.window = [st.rise - 20, st.rise + 5];
    if (p.sun === 'set') s.window = [st.set - 38, st.set - 8];
    keep.push(s);
  });
  return { day, keep, removed, sun: st };
}
const planCache = {};
function planDay(di) {
  const { day, keep, removed, sun } = dayStops(di);
  const ctx = { start: day.start, from: PARIS.hotel.ll, returnTo: PARIS.hotel.ll, dow: day.dow, buffer: PACE[S.pace].buffer };
  const key = JSON.stringify([di, keep.map(k => k.id), S.pace, S.order[di] || null]);
  if (planCache[key]) return planCache[key];
  const best = optimise(keep, ctx);
  let used = best, manual = false;
  const ord = S.order[di];
  if (ord && ord.length === keep.length && ord.every(id => keep.some(k => k.id === id))) {
    used = simulate(ord.map(id => keep.find(k => k.id === id)), ctx); manual = ord.join() !== best.order.map(s => s.id).join();
  }
  const naive = simulate(keep, ctx);
  return planCache[key] = { day, di, sun, removed, best, used, manual, naive, ctx };
}

  ${opts.map((f, i) => flightCard(f, i === 0)).join('')}`;

let _fcache = null;
function flightOptions() {
  if (!_fcache) _fcache = FLIGHTS.map(f => {
    const a = f.segs[0], b = f.segs[f.segs.length - 1];
    const durMin = (b.arr - a.dep) / 6e4, layMin = f.segs.length > 1 ? (f.segs[1].dep - f.segs[0].arr) / 6e4 : 0;
    const long = f.segs.reduce((m, s) => (s.arr - s.dep) > (m.arr - m.dep) ? s : m, f.segs[0]);
    const arrLocal = new Date(b.arr + AIRPORTS.CDG.off * 36e5);
    const sides = f.segs.map(s => sunSide({ from: AIRPORTS[s.from].ll, to: AIRPORTS[s.to].ll, dep: s.dep, arr: s.arr }));
    return { ...f, durMin, layMin, arrLocalMin: arrLocal.getUTCHours() * 60 + arrLocal.getUTCMinutes(), sleepAlign: nightOverlap(long.dep, long.arr, AIRPORTS.CDG.off), sides };
  });
  const scored = _fcache.map(f => ({ ...f, score: scoreFlight(f, _fcache, { comfort: S.comfort }) }));
  return scored.sort((x, y) => y.score.total - x.score.total);
}
function sunSummary(f) {
  const want = S.sun === 'rise' ? 'sunrise' : 'sunset', all = f.sides.flatMap((s, i) => s.events.map(ev => ({ ev, seg: f.segs[i] })));
  const good = all.filter(x => !isBehind(x.ev.rel));
  const pick = good.find(x => x.ev.type === want) || all.find(x => x.ev.type === want) || good[0] || all[0];
  return pick ? { ...pick, match: pick.ev.type === want, behind: isBehind(pick.ev.rel) } : null;
}
function evClock(e, seg) {                                         // event time in the nearer city's clock
  const near = (e.t - seg.dep) / (seg.arr - seg.dep) > .5 ? seg.to : seg.from;
  return `${localHM(e.t, AIRPORTS[near].off)} ${L(AIRPORTS[near].name.replace(' CDG', '') + ' time', AIRPORTS[near].name.replace(' CDG', '') + '时间')}`;
}
function flightCard(f, best) {
  const a = f.segs[0], b = f.segs[f.segs.length - 1];
  const sun = sunSummary(f), dd = localDayDiff(b.arr, AIRPORTS.CDG.off, a.dep, AIRPORTS.MEL.off);
  const arrH = f.arrLocalMin / 60;
  const arrTag = arrH >= 11 && arrH <= 17 ? `<span class="tag ok">${ic('sun')}${L('Afternoon landing — best for jet lag', '下午落地 · 最利于倒时差')}</span>` : arrH < 9 ? `<span class="tag warn">${ic('moon')}${L('Lands at dawn — long first day', '清晨落地 · 第一天会很长')}</span>` : `<span class="tag">${ic('clock')}${L('Morning landing', '上午落地')}</span>`;
  const sunTag = !sun ? `<span class="tag">${ic('moon')}${L('No sunrise/sunset in flight', '飞行中无日出日落')}</span>`
    : sun.behind ? `<span class="tag">${ic(sun.ev.type)}${sun.ev.type === 'sunrise' ? L('Sunrise behind the tail', '日出在机尾方向') : L('Sunset behind the tail', '日落在机尾方向')}</span>`

function flightScreen(id) {

    const f = flightOptions().find(x => x.id === id), a = f.segs[0], b = f.segs[f.segs.length - 1];
    const P = f.score.parts, jl = jetlagPlan({ homeOff: AIRPORTS.MEL.off, destOff: AIRPORTS.CDG.off, wake: 7 });
    const want = S.sun === 'rise' ? 'sunrise' : 'sunset';
    const events = f.sides.flatMap((s, i) => s.events.map(e => ({ ...e, seg: f.segs[i] })));
    const longIdx = f.segs.reduce((m, s, i, arr) => (s.arr - s.dep) > (arr[m].arr - arr[m].dep) ? i : m, 0);
    const dayLeg = f.sides.map((s, i) => ({ s, i })).sort((x, y) => (y.s.dayL + y.s.dayR) - (x.s.dayL + x.s.dayR))[0];
    const glareSide = dayLeg && (dayLeg.s.dayL + dayLeg.s.dayR) > 6 ? (dayLeg.s.dayL > dayLeg.s.dayR ? 'L' : 'R') : null;
    const match = events.find(e => e.type === want && !isBehind(e.rel));
    const recSide = match ? match.side : glareSide ? (glareSide === 'L' ? 'R' : 'L') : 'L';
    const alt = match ? null : flightOptions().find(o => o.id !== f.id && o.sides.some(sd => sd.events.some(e => e.type === want && !isBehind(e.rel))));
    const relTxt = e => ({ ahead: L('ahead', '前方'), behind: L('behind you', '后方'), 'behind-abeam': L('slightly behind', '稍偏后'), 'ahead-abeam': L('slightly ahead', '稍偏前'), abeam: L('straight out the window', '正对窗外') }[relWord(e.rel)]);
    const evRows = events.length ? events.map(e => { const bh = isBehind(e.rel); return `<div class="sunev"><span class="ic" ${bh ? 'style="background:var(--fill);color:var(--fg-2)"' : ''}>${ic(e.type)}</span><div><b>${e.type === 'sunrise' ? L('Sunrise', '日出') : L('Sunset', '日落')} ${evClock(e, e.seg)} · ${bh ? L('behind the tail', '在机尾方向') : e.side === 'L' ? L('left side, seats A', '左侧 A 座') : L('right side, seats K', '右侧 K 座')}</b><span>${e.seg.no} · ${bh ? L('The sun comes up behind the plane — you’ll see the sky glow, not the sun itself, from either side.', '太阳从飞机后方升起 —— 两侧都只能看到天边泛光，看不到太阳本身。') : L(`near ${e.p[0].toFixed(0)}°, ${e.p[1].toFixed(0)}° · ${relTxt(e)}`, `约 ${e.p[0].toFixed(0)}°, ${e.p[1].toFixed(0)}° · ${relTxt(e)}`)}</span></div></div>` }).join('')
      : `<div class="sunev"><span class="ic" style="background:var(--fill);color:var(--fg-2)">${ic('moon')}</span><div><b>${L('No sunrise or sunset while flying', '飞行途中没有日出日落')}</b><span>${L('Long leg is in darkness the whole way — good for sleep.', '长航段全程黑夜 —— 适合睡觉。')}</span></div></div>`;
    const seatSvg = seatMap(recSide, events, glareSide);
    const jlRows = jl.plan.slice(0, 5).map((d, i) => {
      const seg = (r, cls) => { const [s0, s1] = r; const parts = s1 > s0 ? [[s0, s1]] : [[s0, 24], [0, s1]]; return parts.map(([u, v]) => `<s class="${cls}" style="left:${u / 24 * 100}%;width:${(v - u) / 24 * 100}%"></s>`).join('') };
      return `<div class="r"><span>${i === 0 ? L('Land day', '落地日') : fdate(new Date(Date.UTC(2026, 10, 17 + i)).toISOString().slice(0, 10)).split(' ')[0] + (S.lang === 'zh' ? '' : '')}</span><div class="track">${seg([23, 7], 'sleep')}${seg(d.seek, 'seek')}${seg(d.avoid, 'avoid')}${i === 0 ? `<s style="left:${f.arrLocalMin / 1440 * 100}%;width:2px;background:var(--fg);border-radius:0"></s>` : ''}</div></div>`;
    }).join('');
    const sleepPct = Math.round(f.sleepAlign * 100);
    return navbar({ left: backBtn(), title: `${f.airline}` }) + `<div class="scroller">
    <div style="padding:0 20px"><div class="ftimes" style="margin-top:0"><div class="tm"><b style="font-size:30px">${localHM(a.dep, AIRPORTS.MEL.off)}</b><span>Melbourne · ${fdate('2026-11-16')}</span></div><div class="mid">${dur(f.durMin)}<i></i>${L('via', '经')} ${f.via}</div><div class="tm" style="text-align:right"><b style="font-size:30px">${localHM(b.arr, AIRPORTS.CDG.off)}</b><span>Paris · ${fdate('2026-11-17')}</span></div></div></div>
    <div class="card" style="display:flex;gap:14px;align-items:center">${ring(f.score.total)}<div style="flex:1"><b>${L('Fit score', '契合分')} ${f.score.total}/100</b><div style="font-size:13px;color:var(--fg-2);margin-top:2px">${L('Weights follow your price ↔ comfort setting.', '权重随你的“价格 ↔ 舒适”设置变化。')}</div></div></div>
    <div class="card"><div class="bars">${[[L('Arrival time', '落地时间'), P.arrive], [L('Sleep on the long leg', '长航段睡眠'), P.sleep], [L('Total duration', '总时长'), P.dur], [L('Layover', '中转'), P.lay], [L('Price', '价格'), P.price]].map(([t, v]) => `<div><span>${t}</span><i><s style="width:${Math.round(v * 100)}%"></s></i><em>${Math.round(v * 100)}</em></div>`).join('')}</div>
    <p style="font-size:13px;color:var(--fg-2);margin-top:10px;line-height:1.5">${L(`Long leg ${f.segs[longIdx].no}: ${sleepPct}% of it falls in Paris night-time, so sleeping on board moves you toward Paris time.`, `长航段 ${f.segs[longIdx].no}：有 ${sleepPct}% 落在巴黎的夜间，机上睡觉能帮你往巴黎时间靠。`)}</p></div>

    ${glareSide ? `<div class="note" style="margin:8px 0 0">${ic('sun')}<span>${L(`Daytime leg ${f.segs[dayLeg.i].no}: the sun sits on the <b>${glareSide === 'L' ? 'left' : 'right'}</b> for ${Math.round(Math.max(dayLeg.s.dayL, dayLeg.s.dayR) / (dayLeg.s.dayL + dayLeg.s.dayR) * 100)}% of daylight. Want shade for a nap? Sit ${glareSide === 'L' ? 'right (K)' : 'left (A)'}.`, `白天航段 ${f.segs[dayLeg.i].no}：日照有 ${Math.round(Math.max(dayLeg.s.dayL, dayLeg.s.dayR) / (dayLeg.s.dayL + dayLeg.s.dayR) * 100)}% 的时间在<b>${glareSide === 'L' ? '左' : '右'}侧</b>。想遮阴补觉就坐${glareSide === 'L' ? '右侧 K' : '左侧 A'}。`)}</span></div>` : ''}

  return () => {
    const step = UI.ks || 1, M = S.merch, prod = MERCH.find(m => m.id === M.product);
    const to = { me: { n: L('You · Melbourne', '你 · 墨尔本'), where: L('Printed in Melbourne', '在墨尔本印制'), eta: L('3–4 days', '3–4 天') }, mia: { n: 'Mia · Sydney', where: L('Printed in Sydney', '在悉尼印制'), eta: L('3–5 days', '3–5 天') }, leo: { n: L('Leo · Singapore', 'Leo · 新加坡'), where: L('Printed in Singapore', '在新加坡印制'), eta: L('2–4 days', '2–4 天') } }[M.to];
    const dots = `<div class="dots">${[1, 2, 3].map(i => `<i class="${i === step ? 'on' : ''}"></i>`).join('')}</div>`;
    let body = '';
    if (step === 1) body = `<div class="ltitle">${L('Add your materials', '添加素材')}</div><div class="lsub">${L('A boarding pass, a ticket stub, photos from the trip.', '登机牌、门票存根、旅途照片。')}</div>
      <div class="card"><h4>${L('Boarding pass', '登机牌')}</h4><div class="passwrap" id="passwrap">${boardingPass(S.scanned, S.scanned)}</div>
      ${S.scanned ? `<div class="wrapchips" style="margin-top:10px"><span class="tag ok">${ic('check')}${L('Barcode removed', '条形码已抹除')}</span><span class="tag ok">${ic('check')}${L('Booking ref removed', '订座号已抹除')}</span><span class="tag ok">${ic('check')}${L('Frequent-flyer no. removed', '常旅客号已抹除')}</span><span class="tag ok">${ic('check')}${L('Name → initials', '姓名 → 缩写')}</span></div>
      <p style="font-size:13px;color:var(--fg-2);margin-top:10px;line-height:1.5">${L('The barcode on a boarding pass holds your name and booking code — anyone with it could change your booking. We read it on your phone, redraw the design from the safe fields only, and never upload the original.', '登机牌条码里有你的姓名和订座号 —— 拿到它的人可以改你的订单。我们在手机上识别，只用安全字段重绘设计，原图从不上传。')}</p>`
      : `<button class="btn primary" style="margin-top:12px" data-act="scanpass">${ic('scan')}${L('Scan boarding pass', '扫描登机牌')}</button>`}</div>
      <div class="card"><h4>${L('Photos from 16–23 Nov only', '仅限 11 月 16–23 日的照片')}</h4><div class="photos">${Array.from({ length: KS_PHOTOS.length }, (_, i) => `<button class="${(UI.pick || PICK0).includes(i) ? 'on' : ''}" data-act="pick" data-i="${i}" aria-label="${L('Photo', '照片')} ${i + 1}">${ksPhoto(i, 'ks')}<span class="ck">${ic('check')}</span></button>`).join('')}</div>
      <p style="font-size:12px;color:var(--fg-2);margin-top:8px">${L(`${(UI.pick || PICK0).length} of 9 picked — the grid magnet uses all nine`, `已选 ${(UI.pick || PICK0).length} / 9 张 —— 九宫格冰箱贴会全部用上`)}</p>
      <p style="font-size:12px;color:var(--fg-3);margin-top:8px">${L('Uses the system photo picker — no access to the rest of your library.', '使用系统照片选择器 —— 不会访问相册其他照片。')}</p></div>
      <div style="padding:16px"><button class="btn primary" data-act="ksnext" ${S.scanned ? '' : 'disabled'}>${L('Choose a keepsake', '选择纪念品')}</button></div>`;
    if (step === 2) body = `<div class="ltitle">${L('Choose a keepsake', '选择纪念品')}</div>
      <div class="magnet-preview">${merchPreview(M.product)}</div>
      <div style="padding:0 16px">${MERCH.map(m => `<button class="merch press ${M.product === m.id ? 'on' : ''}" data-act="product" data-id="${m.id}"><div class="th">${merchPreview(m.id)}</div><div class="rt"><b>${esc(T(m.n))}</b><span>${esc(T(m.d))}</span><span>${m.size}</span></div><span class="p">${money(m.price)}</span></button>`).join('')}</div>
      <div class="note">${ic('printer')}<span>${L(`Print check: all ${(UI.pick || PICK0).length} photos are sharp enough at this size (≥300 dpi).`, `打印检查：${(UI.pick || PICK0).length} 张照片在此尺寸下清晰度足够（≥300 dpi）。`)}</span></div>
      <div class="card" style="display:flex;gap:12px;align-items:center"><div style="width:96px;flex:none">${merchPreview('map')}</div><div><b style="font-size:15px">${L('Free with every order', '每单附赠')}</b><p style="font-size:13px;color:var(--fg-2);margin:3px 0 0;line-height:1.45">${L('A postcard of the route you actually walked — the gift that goes in the box.', '一张你真实走过的路线明信片 —— 放在盒子里的小礼物。')}</p></div></div>
      <div style="padding:16px"><button class="btn primary" data-act="ksnext">${L('Where should it go?', '寄到哪里？')}</button></div>`;
    if (step === 3) body = `<div class="ltitle">${L('Send it', '寄出')}</div><div class="lsub">${L('To yourself, or as a gift to a trip-mate.', '寄给自己，或作为礼物送给旅伴。')}</div>
      <div style="padding:0 16px">${['me', 'mia', 'leo'].map(k => `<button class="opt press ${M.to === k ? 'on' : ''}" data-act="shipto" data-v="${k}">${av(k, 36)}<div class="rt"><b>${k === 'me' ? L('Send to me', '寄给我') : L(`Gift to ${pn(PEOPLE[k])}`, `送给 ${pn(PEOPLE[k])}`)}</b><span>${k === 'me' ? L('Melbourne', '墨尔本') : PEOPLE[k].city} · ${L('printed locally where our partners can', '尽量在当地印制')}</span></div>${M.to === k ? ic('check') : ''}</button>`).join('')}
      ${M.to !== 'me' ? `<label class="field"><span>${L('Gift note', '礼物留言')}</span><textarea data-input="note" placeholder="${L('Remember the sunrise at Trocadéro?', '还记得特罗卡德罗的日出吗？')}">${esc(M.note)}</textarea><small>${L('No prices on the packing slip.', '装箱单上不显示价格。')}</small></label>` : ''}</div>
      <div class="card"><div class="kv" style="grid-template-columns:1fr 1fr"><div><b>${money(prod.price)}</b><span>${esc(T(prod.n))}</span></div><div><b>${to.eta}</b><span>${to.where}</span></div></div>
      <p style="font-size:13px;color:var(--fg-2);margin-top:10px;line-height:1.5">${L('Price includes tax and delivery. Wherever our print partners can, we print in the recipient’s country to avoid import duty. Print files are deleted 30 days after shipping.', '价格含税和运费。只要印制伙伴能做到，就在收件人所在国印制，避免进口关税。打印文件在发货 30 天后删除。')}</p></div>
      <div style="padding:16px"><button class="btn dark" data-act="pay">${L(`Pay ${money(prod.price)} with Apple Pay`, `Apple Pay 支付 ${money(prod.price)}`)}</button></div>`;
    return navbar({ left: `<button class="cbtn glass press" data-act="${step > 1 ? 'ksback' : 'back'}" aria-label="${L('Back', '返回')}">${ic('back')}</button>`, title: L('Keepsake', '纪念品') }) + `<div class="scroller">${dots}${body}</div>`;
  };
}

/* ════════════ SkyView: what is outside the window ════════════
   One fragment shader draws the view from a seat. Nothing here is a photo: the sky, the sun, the sea glitter, the
   snow line and the city lights are all computed from the sun's real elevation and its bearing relative to the window,
   so the same code can draw any flight (or, later, a train or a ferry) at any minute of the journey.
   Scenes: 0 open sea · 1 coastal city · 2 mountains · 3 cloud deck · 4 city / farmland (lights at night) · 5 airport at ground level
           6 ground level for trains and ships: fields or water, a town skyline, a far mountain (volcano / snowy range / hills)
   Two scenes can be cross-faded (uMix) while the camera height and pitch glide between them. */
const SKY_FRAG = `

uniform vec2 uRes,uScr; uniform float uTime,uEl,uAlt,uPitch,uMix,uFov;

float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*noise(p);p=p*2.03+vec2(11.3,7.7);a*=.5;}return s;}
float fbm3(vec2 p){float a=.5,s=0.;for(int i=0;i<3;i++){s+=a*noise(p);p=p*2.03+vec2(11.3,7.7);a*=.5;}return s;}

vec3 sky(vec3 rd,float disc){

  vec3 hor=mix(mix(vec3(.008,.011,.026),vec3(.07,.09,.20),n),vec3(.50,.68,.90),d);

vec3 coast(vec2 p,vec3 rd,float t){

    cty=mix(cty,vec3(.40,.36,.31),clamp(ave,0.,1.)*.7);

    cty=mix(cty,vec3(.80,.69,.50),smoothstep(.11,.05,s));

}
float mh(vec2 p){return ridged(p*.13+vec2(4.,1.));}
vec3 mount(vec2 p,vec3 rd,float t,float snow){
  float h=mh(p),e=.10;
  vec2 d=vec2(mh(p+vec2(e,0.))-h,mh(p+vec2(0.,e))-h)/e;
  vec3 n=normalize(vec3(-d.x*2.6,1.,-d.y*2.6));
  vec2 sd=normalize(uSun.xz+1e-4);float tn=uSun.y/max(length(uSun.xz),.05);
  float sh=1.;for(int i=1;i<=4;i++){float st=float(i)*.55;sh=min(sh,smoothstep(-.02,.03,h+st*max(tn,.02)*.33-mh(p+sd*st)));}
  float dif=clamp(dot(n,uSun)*1.6+.05,0.,1.);

  vec3 rock=mix(vec3(.13,.14,.15),vec3(.30,.27,.24),fbm3(p*1.6));
  vec3 alb=mix(vec3(.05,.09,.07),rock,smoothstep(.16,.36,h));
  alb=mix(alb,vec3(.84,.88,.95),sl*(1.-.6*smoothstep(.18,.42,1.-n.y)));

vec3 deck(vec3 rd){
  float t=1.5/max(-rd.y,1e-3);vec2 p=rd.xz*t+vec2(SCR,0.);
  vec2 q=p*.85;q+=.7*vec2(fbm3(q*.5+2.),fbm3(q*.5+8.));
  float h=fbm(q)*.75+fbm3(q*3.3+4.)*.25;
  vec2 sd=normalize(uSun.xz+1e-4),q2=q+sd*.12;
  float hs=fbm(q2)*.75+fbm3(q2*3.3+4.)*.25;
  float lit=smoothstep(-.03,.07,h-hs),pk=smoothstep(.34,.66,h),low=1.-smoothstep(0.,14.,uEl);
  vec3 shd=mix(AMB*.9,vec3(.10,.07,.09)*(.3+DAY)+AMB*.12,low);

  vec3 c=mix(shd*(.45+.55*pk),lig,lit*(.25+.75*pk));

vec3 city(vec2 p,vec3 rd,float t,vec4 P){

  vec2 w=p+1.6*vec2(fbm3(p*.19+1.7),fbm3(p*.19+6.1));
  vec2 w2=vec2(w.x*.82-w.y*.57,w.x*.57+w.y*.82);

  float minor=max(smoothstep(.06,.0,min(f2.x,f2.y)),smoothstep(.055,.0,min(f3.x,f3.y))*.8);

  L+=mix(warm,white,step(.8,hash(floor(w*40.)+3.)))*step(.972-.10*dens,hash(floor(w*40.)))*dens*.85;
  vec2 a1=normalize(vec2(1.,.55)),a2=normalize(vec2(-.6,1.)),a3=normalize(vec2(.25,1.));

vec3 airport(vec3 rd,vec2 uv){

  const st = mtStatus(), P = st.P, cities = [...new Set(P.p.route)].filter(c => c !== MT.home).length, todo = mtTodoList(), done = todo.filter(x => S.mt.todo[x.id]).length;

    <div class="art"><svg viewBox="0 0 361 300" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="mthg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B4F8A"/><stop offset=".6" stop-color="#1E86CF"/><stop offset="1" stop-color="#F3906A"/></linearGradient></defs>${mtRegion(361, 300, { noLabel: 1, dx: 78, sea: 'url(#mthg)', land: 'rgba(255,255,255,.17)', coast: 'rgba(255,255,255,.24)', stroke: '#FFE1CF', dot: '#fff', dotFill: '#F47A4E', padT: 34, padB: 26 })}</svg></div>
    <div class="in"><span class="kicker">${L('My trip', '我的行程')} · ${fdate(P.start, false)} – ${fdate(P.end, false)}</span>

  <button class="progress press stg" data-act="mt:open" data-tab="todo"><div class="rt"><b>${L(`Ready to go: ${done} of ${todo.length}`, `准备进度：${done}/${todo.length}`)}</b><span>${next ? L('Next: ', '下一步：') + esc(next.t) : L('All set', '全部就绪')}</span><div class="bar"><i style="width:${done / todo.length * 100}%"></i></div></div>${ic('chev', 'chev')}</button>`;
}
const mtCityName = id => MT.city[id].flag + ' ' + T(MT.city[id].n);
function mtDayTitle(d) { return mtDayCities(d).map(c => T(MT.city[c].n)).join(' → ') }
function mtDaySub(d) { return d.parts.map(x => { if (x[0] !== '>') return T(MT.block[x].t); const l = MT.leg[x.slice(1)]; return `${l.kind === 'air' ? '✈' : l.kind === 'rail' ? '🚄' : '🛂'} ${l.dep} ${l.carrier}${l.no ? ' ' + l.no : ''}` }).join(' · ') }

/* ── Hub screen ── */

    <div class="mapbadge glass">${ic('info')}<span>${tab === 'plan' && MTU.day >= 0 && mtCityModel(MTU.day) ? L('Sketch map · tap a pin', '示意图 · 点图钉看详情') : L(`Prices checked ${mtAsof()}`, `价格与规定核对于 ${mtAsof()}`)}</span></div>
    ${tab === 'plan' && MTU.day >= 0 && mtCityModel(MTU.day) ? `<div class="mapctl"><button class="cbtn glass press" data-act="mt:zoom" data-f="1.4" aria-label="${L('Zoom in', '放大')}">${ic('plus')}</button><button class="cbtn glass press" data-act="mt:zoom" data-f="0.7" aria-label="${L('Zoom out', '缩小')}">${ic('minus')}</button></div>` : ''}</div>

/* Itinerary tab */
function mtPlanBody() {
  const P = mtPlan(), di = MTU.day, grad = MT.key.find(k => k[2] === 'coral')[0];
  const chips = `<button class="daychip press ${di < 0 ? 'on' : ''}" style="--c:var(--sky-fill)" data-act="mt:day" data-i="-1"><i>${L('ALL', '总览')}</i><b>${P.days.length}</b></button>` +
    P.days.map((d, i) => `<button class="daychip press ${i === di ? 'on' : ''} ${d.d === grad ? 'star' : ''}" style="--c:${MT.city[mtNightCity(d)].c}" data-act="mt:day" data-i="${i}"><i>${mtMD(d.d)}</i><b>${i + 1}</b></button>`).join('');
  return `<div class="daychips" id="mtchips">${chips}</div>${di < 0 ? mtOverview(P) : mtDayBody(P, di)}`;
}
function mtOverview(P) {
  const st = mtStatus(), keys = MT.key.filter(k => k[0] >= mtAdd(P.start, -3) && k[0] <= mtAdd(P.end, 3));
  const head = st.before ? L(`${st.left} days to go`, `还有 ${st.left} 天出发`) : st.after ? L('Trip finished', '行程已结束') : L(`Day ${st.di + 1} of ${P.days.length}`, `今天是第 ${st.di + 1} 天`);

  <div class="mt-ovl">${P.days.map((d, i) => { const c = MT.city[mtNightCity(d)], today = d.d === st.t; return `<button class="mt-ov press ${today ? 'today' : ''}" data-act="mt:day" data-i="${i}"><span class="dt"><b>${mtMD(d.d)}</b><i>${S.lang === 'zh' ? DOW_ZH[mtDow(d.d)] : DOW_EN[mtDow(d.d)]}</i></span><span class="bar" style="background:${c.c}"></span><div class="rt"><b>${esc(mtDayTitle(d))}</b><span>${esc(mtDaySub(d))}</span></div>${ic('chev', 'chev')}</button>` }).join('')}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 0"><button class="btn soft" data-act="mt:ics">${ic('calendar')}${L('Add to Calendar', '加入日历')}</button><button class="btn soft" data-act="mt:plans">${ic('layers')}${L('Compare plans', '方案对比')}</button></div>
  <p class="mt-fine">${L(`Fares, rooms and entry rules were checked on ${MT.asof}. They move — re-check before you pay; the app never books for you.`, `机票、房价和入境规定核对于 ${MT.asof}，会变动——付款前请再查一次。App 只负责规划，下单在你。`)}</p>`;
}
function mtDayBody(P, di) {
  const day = mtDay(di), main = mtMainBlock(day), c0 = main ? main.c : MT.city[mtNightCity(day.raw)], sun = main ? main.sun : sunTimes(day.d, c0.off, c0.ll[0], c0.ll[1]);
  const key = MT.key.find(k => k[0] === day.d), blocks = day.parts.filter(p => p.blk);
  let h = `<div class="dayhead"><div class="rt"><b>${fdate(day.d)} · ${L('Day', '第')} ${di + 1}${L('', ' 天')}</b><span>${ic('sunrise')} ${hm(sun.rise)} · ${ic('sunset')} ${hm(sun.set)} · ${esc(T(c0.n))}</span></div></div>`;
  if (key) h += `<div class="note ${key[2] || 'sky'}">${ic(key[2] === 'coral' ? 'star' : 'calendar')}<span><b>${esc(T(key[1]))}</b></span></div>`;
  if (c0.wx) h += `<div class="dstats"><span class="tag">${ic('sun')}${esc(c0.wx.split('，')[0])}</span>${blocks.length ? `<span class="tag">${ic('walk')}${blocks.reduce((t, b) => t + b.blk.sim.walkKm, 0).toFixed(1)} km</span>` : ''}<button class="tag sky" data-act="mt:country" data-cc="${c0.cc}">${ic('book')}${esc(T(MTG.country[c0.cc].n))}${L(' guide', '须知')}</button></div>`;
  day.parts.forEach((p, i) => { h += p.leg ? `<div class="mt-legwrap">${mtLegRow(p.id, day.d)}</div>` : mtBlockHTML(p.blk, day.d, i === day.parts.length - 1, blocks.length > 1 ? blocks.indexOf(p) : -1) });
  return h + `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 0">
    ${main && main.sim.steps.length ? `<button class="btn soft" data-act="mt:nav" data-i="${di}">${ic('map')}${L('Navigate', '导航这一天')}</button>` : ''}
    <button class="btn soft" data-act="mt:exp" data-d="${day.d}">${ic('coins')}${L('Log spending', '记一笔')}</button></div>`;
}
function mtBlockHTML(B, date, last, idx) {
  const { b, c, sim, closed } = B, dw = mtDow(date);
  let h = `<div class="mt-bh"><i style="background:${c.c}"></i><div class="rt"><b>${c.flag} ${esc(T(c.n))} · ${esc(T(b.t))}</b><span>${sim.steps.length ? L(`Leave at ${hm(b.start)}`, `${hm(b.start)} 出发`) + ` · ${sim.steps.length} ${L('stops', '站')}` : L('No sightseeing planned', '不安排游览')}</span></div>${idx >= 0 && sim.steps.length ? `<button class="btn sm soft" data-act="mt:part" data-i="${idx}">${ic('map')}${L('Map', '地图')}</button>` : ''}</div>`;
  closed.forEach(id => { h += `<div class="removed">${ic('alert')}<div style="flex:1"><b>${esc(T(MT.pl[id].n))}</b>${L(`Closed on ${dowName(dw)} — left out of this day.`, `${dowName(dw)}不开放，已从这一天拿掉。`)}</div></div>` });
  if (sim.steps.length) {
    h += `<div class="tl">`;
    sim.steps.forEach((st, i) => {
      const p = MT.pl[st.stop.id], lg = st.leg, hrs = p.hours ? (p.hours[dw] || []) : null, issue = sim.issues.find(x => x.id === st.stop.id), bd = [];
      if (issue) bd.push(`<span class="tag danger">${ic('alert')}${issue.kind === 'closes' ? L(`Closes ${hm(issue.at)}`, `${hm(issue.at)} 关门，来不及`) : L('Too late for this slot', '赶不上这一场')}</span>`);
      if (p.window && !p.meal && !p.sun) bd.push(`<span class="tag coral">${ic('clock')}${L('Fixed time', '定时场次')} ${hm(st.arrive)}</span>`);
      if (p.sun) bd.push(`<span class="tag coral">${ic('sunset')}${L('Sunset', '日落')} ${hm(B.sun.set)}</span>`);
      if (p.ticket) bd.push(`<span class="tag sky">${ic('ticket')}${L('Book ahead', '建议预订')}</span>`);
      if (!issue && hrs && hrs.length) bd.push(`<span class="tag ok">${ic('check')}${hrs.map(x => hm(x[0]) + '–' + hm(x[1])).join(' / ')}</span>`);
      if (p.price) bd.push(`<span class="tag">${mtLocal(p.price)}</span>`);
      h += `<div class="legrow"><div class="rail"><i></i></div><span class="legchip ${lg.mode === 'ride' ? 'metro' : 'walk'}">${ic(lg.mode === 'ride' ? 'car' : 'walk')}${lg.mode === 'ride' ? L('Ride', '打车') : L('Walk', '步行')} ${lg.min} ${L('min', '分钟')}${lg.mode === 'walk' ? ' · ' + lg.km.toFixed(1) + ' km' : ''}</span></div>
      <div class="stop ${p.rest ? 'rest' : ''} ${MTU.hl === st.stop.id ? 'hl' : ''}" style="--c:${c.c}" data-stop="${st.stop.id}"><div class="rail"><span class="pinno">${p.rest ? ic('bed') : i + 1}</span><span class="line"></span></div>
        <div class="body"><button class="rt" data-act="mt:stop" data-id="${st.stop.id}" data-d="${date}" style="text-align:left"><div class="t">${hm(st.arrive)}–${hm(st.leave)} <em>· ${mtDur(p.dur)}</em></div><h3>${esc(T(p.n))}</h3><div class="bdg">${bd.slice(0, 3).join('')}</div>${p.tip ? `<div class="tip">${esc(p.tip)}</div>` : ''}</button></div></div>`;
    });
    if (last && sim.back) h += `<div class="legrow"><div class="rail"><i></i></div><span class="legchip ${sim.back.mode === 'ride' ? 'metro' : 'walk'}">${ic('bed')}${L('Back to the hotel', '回酒店')} ~${hm(sim.end)}</span></div>`;
    h += `</div>`;
  }
  if (b.note) h += `<div class="note">${ic('info')}<span>${esc(b.note)}</span></div>`;
  return h;
}

/* Transport */
const mtLegIcon = l => l.kind === 'air' ? 'plane' : l.kind === 'rail' ? 'metro' : 'flag';
const mtLegBg = l => l.kind === 'air' ? 'var(--sky-fill)' : l.kind === 'rail' ? '#0B7A75' : '#B5651D';
function mtLegRow(id, date, withDate) {

  return `<button class="mt-leg press" data-act="mt:leg" data-id="${id}" data-d="${date}"><span class="ico" style="background:${mtLegBg(l)}">${ic(mtLegIcon(l))}</span>

}

  ${MT.late.plans.includes(P.id) ? `<div class="sec" style="padding-top:18px"><h2 style="font-size:17px">${esc(T(MT.late.ui.q))}</h2></div><div class="seg"><button class="${!P.late ? 'on' : ''}" data-act="mt:late" data-v="0">${esc(T(MT.late.ui.a))}</button><button class="${P.late ? 'on' : ''}" data-act="mt:late" data-v="1">${esc(T(MT.late.ui.b))}</button></div>
  <div class="note ${P.late ? 'warn' : ''}">${ic(P.late ? 'alert' : 'shield')}<span>${esc(T(P.late ? MT.late.ui.nb : MT.late.ui.na))}</span></div>` : ''}
  <p class="mt-fine">${L(`Fares are for one adult, read off live searches on ${MT.asof}. Low-cost carriers charge extra for checked bags. Tap a leg for how to get there, alternatives and a live price check.`, `票价为单人、含税，取自 ${MT.asof} 的实时搜索；廉航托运行李另计。点开每一段可以看怎么走、备选班次和实时查价。`)}</p>`;
}
const mtGF = (l, date) => `https://www.google.com/travel/flights?q=${encodeURIComponent(`Flights from ${l.q[0]} to ${l.q[1]} on ${date} one way`)}&curr=CNY`;

  ${l.q ? `<a class="btn primary stg" style="margin-top:14px" href="${mtGF(l, date)}" target="_blank" rel="noopener">${ic('ext')}${L('Check today’s price', '查今天的实时价')}</a>` : ''}

  <div class="card stg" style="margin:12px 0 0"><label class="mt-toggle"><input type="checkbox" data-mt="book" data-k="${k}" ${bk ? 'checked' : ''}><span>${L('I have booked this', '这一段我已经订好了')}</span></label>

  <p class="stg mt-fine" style="padding:10px 0 0">${L('We plan, you book: the buttons open the seller’s own site.', 'App 只做规划和比价，按钮会打开航司或售票方自己的页面，由你下单。')}</p>`, { large: true });
}

/* Stays */
function mtBookingURL(cid, d, n) { return `https://www.booking.com/searchresults.html?ss=${encodeURIComponent(MT.city[cid].q)}&checkin=${d}&checkout=${mtAdd(d, n)}&group_adults=${MT.pax}&no_rooms=1&group_children=0&selected_currency=CNY` }

/* Checklist */
function mtDue(x, P) {
  const t = mtNow();
  if (x.win) { const cid = x.win[0][0] === '@' ? (P.stays.find(s => MT.city[s[0]].cc === x.win[0].slice(1)) || [])[0] : x.win[0], s = P.stays.find(y => y[0] === cid); if (!s) return null; const a = mtAdd(s[1], -x.win[1]), b = s[1]; return { label: `${mtMD(a)} – ${mtMD(b)}`, hot: t >= a && t <= b, late: t > b } }
  if (x.off != null && x.on) { const d = mtAdd(P.start, x.off); return { label: L(`on ${fdate(d, false)}`, `${fdate(d, false)}当天`), hot: mtDiff(d, t) <= 3 && t <= d, late: t > d } }
  if (x.off != null) { const d = mtAdd(P.start, x.off); return { label: L(`by ${fdate(d, false)}`, `${fdate(d, false)}前`), hot: mtDiff(d, t) <= 7 && t <= d, late: t > d } }
  return null;
}

  openSheet(L('Experience notes', '体验笔记'), `<p class="stg mt-sub">${L('Anything that felt wrong, slow, missing or delightful while using the app — jot it here. It becomes the fix list for the next round.', '用的时候觉得别扭、慢、缺东西、或者特别好用的地方，随手记在这里。回来以后这就是下一轮的修改清单。')}</p>

  ${S.mt.notes.length ? `<div class="card stg" style="margin:14px 0 0"><h4>${S.mt.notes.length} ${L('notes', '条笔记')}</h4>${S.mt.notes.map((n, i) => `<div class="mt-alt"><div class="rt"><b style="font-weight:500;white-space:pre-wrap">${esc(n.text)}</b><span>${esc(n.at.slice(0, 16).replace('T', ' '))} · ${esc(n.where)}</span></div><button class="x" data-act="mt:notedel" data-i="${i}" aria-label="${L('Delete', '删除')}">${ic('x')}</button></div>`).join('')}</div>
  <button class="btn soft stg" style="margin-top:10px" data-act="mt:notecopy">${ic('share')}${L('Copy all notes', '复制全部笔记')}</button>` : ''}`, { large: true });

function mtNotesText() { const P = mtPlan(); return [`${BRAND.name} · ${L('experience notes', '体验笔记')} · ${mtNow()}`, `${L('Plan', '方案')} ${P.id} · ${S.mt.tier} · ${navigator.userAgent.replace(/^.*?\((.*?)\).*$/, '$1')}`, ''].concat(S.mt.notes.map((n, i) => `${i + 1}. [${n.at.slice(0, 16).replace('T', ' ')} · ${n.where}] ${n.text}`)).join('\n') }
function mtShowAddr(cid) {
  const el = document.createElement('div'); el.className = 'mt-big'; el.dataset.act = 'mt:hide';
  el.innerHTML = `<span>${MT.city[cid].flag} ${esc(T(MT.city[cid].n))} · ${L('Please take us to', '请送我们到')}</span><b>${esc(S.mt.addr[cid])}</b><i>${L('Tap anywhere to close', '点任意位置关闭')}</i>`;
  app.appendChild(el);
}

/* Calendar: every leg (true UTC instants, so each phone shows local time), hotel nights, and the ceremony. */
function mtICS() {
  const P = mtPlan(), e2 = s => String(s).replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n'), out = ['BEGIN:VCALENDAR', 'VERSION:2.0', `PRODID:-//${BRAND.name}//MyTrip//ZH`, 'CALSCALE:GREGORIAN', `X-WR-CALNAME:${e2(T(MT.title))}`];
  const utc = (d, hmStr, off, plus) => { const [h, m] = hmStr.split(':').map(Number), t = new Date(Date.parse(d + 'T00:00:00Z') + ((h - off) * 60 + m) * 6e4 + (plus || 0) * 864e5); return t.toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z' };
  const ev = (uid, a, b, sum, loc, desc, allday) => out.push('BEGIN:VEVENT', `UID:${uid}@mytrip.${BRAND.web}`, 'DTSTAMP:20261112T000000Z', allday ? `DTSTART;VALUE=DATE:${a}` : `DTSTART:${a}`, allday ? `DTEND;VALUE=DATE:${b}` : `DTEND:${b}`, `SUMMARY:${e2(sum)}`, `LOCATION:${e2(loc)}`, `DESCRIPTION:${e2(desc)}`, 'END:VEVENT');
  P.legs.forEach(x => { const l = MT.leg[x.id], over = l.arr < l.dep && l.tz[0] === l.tz[1] ? 1 : 0; ev('leg-' + x.id, utc(x.d, l.dep, l.tz[0]), utc(x.d, l.arr, l.tz[1], over), `${l.from[0]} → ${l.to[0]} · ${l.carrier}${l.no ? ' ' + l.no : ''}`, l.from[1] + ' / ' + l.from[0], l.how[0]) });
  P.stays.forEach(([c, d, n]) => ev('stay-' + c, d.replace(/-/g, ''), mtAdd(d, n).replace(/-/g, ''), `${L('Stay', '住')} · ${T(MT.city[c].n)}`, S.mt.addr[c] || T(MT.stay[c].area), MT.stay[c].why, true));
  const g = MT.key.find(k => k[2] === 'coral'); ev('grad', g[0].replace(/-/g, ''), mtAdd(g[0], 1).replace(/-/g, ''), T(g[1]), g[3] || '', '', true);
  out.push('END:VCALENDAR'); return out.join('\r\n');
}
async function mtCalendar() {
  const txt = mtICS(), name = 'my-trip.ics';
  try { const f = new File([txt], name, { type: 'text/calendar' }); if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return } } catch (e) { if (e && e.name === 'AbortError') return }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/calendar' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  toast(L('Calendar file saved — open it to add the events', '日历文件已保存，打开即可导入'));
}

/* ── Events ── */
const mtIsHub = () => stack.length && stack[stack.length - 1]._kind === 'mt';
function mtRe(keep) { if (!keep) MTU.hl = null; stack.forEach(el => { if (el._kind && el._kind.startsWith('mt')) rerender(el) }); renderTrips(); $('#t-trips').classList.add('calm') }

  if (mtIsHub()) rerender(topScreen()); else { const el = push(mtScreen()); el._kind = 'mt' }
}

    case 'day': MTU.day = +b.dataset.i; MTU.part = null; MTU.hl = null; if (MTU.tab !== 'plan') MTU.tab = 'plan'; rerender(topScreen()); { const sc = $('#mtscroll'); if (sc) sc.scrollTop = 0 } break;
    case 'part': MTU.part = +b.dataset.i; MTU.hl = null; mtAfter(topScreen()); $('#mtscroll').scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'zoom': zoomMap($('#mtmap', topScreen()), +b.dataset.f); break;
    case 'leg': mtLegSheet(id, b.dataset.d); break;
    case 'stop': mtStopSheet(id, b.dataset.d); break;

    case 'todo': S.mt.todo[id] = !S.mt.todo[id]; save(); mtRe(); break;

    case 'pick': S.mt.plan = id; S.mt.late = S.mt.late && MT.late.plans.includes(id); MTU.day = -1; MTU.part = null; save(); mtRe(); toast(L(`Plan ${id} — itinerary, budget and checklist updated`, `已改用方案 ${id}，行程、预算和清单都已更新`)); break;
    case 'country': { const el = push(mtCountryScreen(b.dataset.cc)); el._kind = 'mt-c' } break;
    case 'gen': mtGenSheet(b.dataset.k); break;
    case 'nav': { const B = mtMainBlock(mtDay(+b.dataset.i)), c = B.c, pts = [c.stay].concat(B.sim.steps.map(s => s.stop.ll), [c.stay]); navSheet(pts, 'transit', L('Navigate this day', '导航这一天'), c.cc.toUpperCase()) } break;
    case 'ics': mtCalendar(); break;
    case 'exp': mtExpSheet(b.dataset.d); break;
    case 'expcur': MTU.exp.cur = b.dataset.v; $$('#mtcur button').forEach(x => x.classList.toggle('on', x === b)); break;
    case 'expcat': MTU.exp.cat = b.dataset.v; $$('#mtcat button').forEach(x => x.classList.toggle('on', x === b)); break;
    case 'expsave': { const amt = parseFloat($('#mtamt').value); if (!(amt > 0)) { toast(L('Enter an amount', '先填金额')); break } S.mt.exp.unshift({ d: MTU.exp.d, cat: MTU.exp.cat, cur: MTU.exp.cur, amt, note: $('#mtexpnote').value.trim() }); save(); closeSheet(); mtRe(true); toast(L(`Logged ${cny(toCNY(amt, MTU.exp.cur))}`, `已记 ${cny(toCNY(amt, MTU.exp.cur))}`)) } break;
    case 'expdel': S.mt.exp.splice(+b.dataset.i, 1); save(); mtRe(true); break;
    case 'note': mtNoteSheet(); break;
    case 'notesave': { const t = $('#mtnote').value.trim(); if (!t) { toast(L('Write something first', '先写点内容')); break } S.mt.notes.unshift({ at: new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString(), where: mtWhere(), text: t }); save(); mtNoteSheet(); mtRe(true); toast(L('Saved', '已保存')) } break;
    case 'notedel': S.mt.notes.splice(+b.dataset.i, 1); save(); mtNoteSheet(); mtRe(true); break;
    case 'notecopy': { const t = mtNotesText(), done = () => toast(L('Notes ready to send', '笔记已导出，可以发回来了')), manual = () => openSheet(L('Copy your notes', '长按全选后复制'), `<label class="field"><textarea readonly style="min-height:260px">${esc(t)}</textarea></label>`, { large: true });
      if (navigator.share) navigator.share({ text: t }).then(done, e => { if (!e || e.name !== 'AbortError') manual() }); else if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, manual); else manual() } break;
    case 'show': mtShowAddr(b.dataset.k); break;
    case 'hide': b.remove(); break;
    case 'unlock': if (!(window.crypto && crypto.subtle)) { toast(L('Unlocking needs the https link', '这个地址不支持解锁，请用 https 的专属链接打开')); break }
      mtTryKey(($('#mtkey') || {}).value || '').then(ok => { if (ok) { mtKeepKey(); rebuildAll(); toast(L('Trip unlocked', '行程已解锁')) } else toast(L('That key did not work', '口令不对，再核对一下')) }); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'mtkey') { e.preventDefault(); e.target.blur(); const b = $('[data-act="mt:unlock"]'); if (b) b.click() } });
document.addEventListener('input', e => { const k = e.target.dataset.mt; if (k === 'ref') { S.mt.ref[e.target.dataset.k] = e.target.value; save() } if (k === 'addr') { S.mt.addr[e.target.dataset.k] = e.target.value; save() } });
document.addEventListener('change', e => { const k = e.target.dataset.mt; if (k === 'book') { S.mt.booked[e.target.dataset.k] = e.target.checked; save(); mtRe(true) } if (k === 'addr') mtRe(true) });

/* ── Encrypted build: the trip data ships as AES-256-CBC (PBKDF2-SHA256), unlocked by a key in the link's #fragment. ── */
async function mtDecrypt(pass) {
  const raw = Uint8Array.from(atob(MT_ENC.data), c => c.charCodeAt(0)), te = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: raw.slice(8, 16), iterations: MT_ENC.iter, hash: 'SHA-256' }, km, 384));
  const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv: bits.slice(32, 48) }, key, raw.slice(16)));
}
function mtLoad(src) { const r = new Function(src + '\n;return { MT_DATA, MT_GUIDE }')(); MT = r.MT_DATA; MTG = r.MT_GUIDE; mtMigrate() }
/* Typed keys arrive with capitals, spaces, or the long dash iOS makes out of "--": try the text as typed, then its letters and digits regrouped in fours. */
function mtKeyForms(k) { const a = String(k).trim().toLowerCase(), b = (a.replace(/[^a-z0-9]/g, '').match(/.{1,4}/g) || []).join('-'); return [...new Set([a, b])].filter(Boolean) }
async function mtTryKey(k) {
  if (MT) return true; if (typeof MT_ENC === 'undefined') return false;
  for (const key of mtKeyForms(k)) {
    try { const src = await mtDecrypt(key); if (!src.startsWith('/*MT1*/')) continue; mtLoad(src); store.set('mtsrc', { v: MT_ENC.v, src }); store.set('mtkey', key); return true } catch (e) { }
  }
  return false;
}
/* Keep the key in the address (#k=…) so that "Add to Home Screen" carries it: the installed app has its own, empty storage. */
function mtKeepKey() { const k = store.get('mtkey', ''); try { if (k && typeof MT_ENC !== 'undefined' && !/[#&]k=/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search + '#k=' + encodeURIComponent(k)) } catch (e) { } }
async function mtBoot() {
  if (MT) return true; if (typeof MT_ENC === 'undefined') return false;
  const c = store.get('mtsrc', null); if (c && c.v === MT_ENC.v) { try { mtLoad(c.src); mtKeepKey(); return true } catch (e) { } }
  let k = ''; try { const m = (location.hash.replace(/^#/, '&') + '&' + location.search.slice(1)).match(/&k=([^&]+)/); if (m) k = decodeURIComponent(m[1]) } catch (e) { }
  // a new build re-encrypts the trip: fall back to the key this device unlocked with, so nobody has to type it again
  const ok = (k && await mtTryKey(k)) || await mtTryKey(store.get('mtkey', '')); if (ok) mtKeepKey(); return ok;
}
/* A newer build took over while the app was open (installed web apps resume rather than relaunch): reload at a quiet moment, then return to the same page. */
function mtFresh() {
  const f = document.activeElement; if (sheetEl || (f && /^(INPUT|TEXTAREA)$/.test(f.tagName))) return false;
  try { if (mtIsHub()) sessionStorage.setItem(NS + 'resume', JSON.stringify({ tab: MTU.tab, day: MTU.day })) } catch (e) { }
  location.reload(); return true;
}
function mtResume() {
  try { const r = JSON.parse(sessionStorage.getItem(NS + 'resume') || 'null'); sessionStorage.removeItem(NS + 'resume'); if (!r || !MT || stack.length) return; MTU.tab = r.tab; MTU.day = Math.min(r.day, mtPlan().days.length - 1); MTU.part = null; mtOpen() } catch (e) { }
}
if (MT) mtMigrate();

/* ════════════ Panel · dock · boot ════════════ */
function renderPanel() {
  const J = (MT ? [['mytrip', L('My real trip', '我的真实行程')]] : []).concat([['onb', L('Onboarding quiz', '引导测试')], ['trip', L('Paris route', '巴黎路线')], ['reopt', L('Re-optimise demo', '重新优化演示')], ['closed', L('Closed-place check', '闭馆检查')], ['seat', L('Flight · sun seat · jet lag', '航班·日出座位·时差')], ['view', L('Window view before you pay', '付款前看窗景')], ['handoff', L('Book hand-off', '预订交接')], ['crew', L('Friends co-plan', '朋友共同规划')], ['road', L('Road trip', '自驾游')], ['trailer', L('Trip trailer', '行程预告片')], ['compose', L('AI builds a trip', 'AI 生成行程')], ['recap', L('Memories recap', '回忆短片')], ['keepsake', L('Boarding-pass magnet', '登机牌冰箱贴')], ['guide', L('Experiences (V2)', '本地体验 V2')], ['become', L('Become a guide', '成为向导')], ['neutral', L('Neutrality promise', '中立承诺')], ['saved', L('Saved & import', '收藏与导入')], ['askai', L('Ask AI → add to a day', '问 AI → 加入某天')], ['history', L('History & undo', '改动记录与撤销')], ['push', L('Push → deep link', '推送直达')], ['calendar', L('Add to Calendar', '加入日历')]]);
  $('#panel').innerHTML = `<div class="brand">${appIcon(46, 'pi')}<div>${BRAND.name}<small>${L('AI route planner · prototype', 'AI 路线规划 · 原型')}</small></div></div>
  <h1>${L('Plan the <em>route</em>,<br>not just the list.', '规划的是<em>路线</em>，<br>不只是清单。')}</h1>
  <p>${L('An interactive prototype. Opening hours, sunrise/sunset seat sides, jet-lag light windows and route order are computed live from real geometry — the data is mock.', '可交互原型。营业时间校验、日出日落座位侧、倒时差光照窗口和路线顺序，全部由真实几何实时计算；数据为模拟。')}</p>
  <div class="toggles"><div class="seg"><button data-act="lang" data-v="en" class="${S.lang === 'en' ? 'on' : ''}">EN</button><button data-act="lang" data-v="zh" class="${S.lang === 'zh' ? 'on' : ''}">中文</button></div>
  <div class="seg">${['auto', 'light', 'dark'].map(t => `<button data-act="theme" data-v="${t}" class="${S.theme === t ? 'on' : ''}">${{ auto: L('Auto', '自动'), light: L('Light', '浅'), dark: L('Dark', '深') }[t]}</button>`).join('')}</div></div>
  <h3>${L('Jump to a flow', '跳转到流程')}</h3><div class="jump">${J.map(([k, t]) => `<button data-act="jump" data-to="${k}">${t}</button>`).join('')}</div>
  <p class="fine">${L('Research behind every screen: docs/ in the project folder. Flight schedules are illustrative; never book from this prototype.', '每个界面背后的调研见项目文件夹 docs/。航班时刻仅为示意，请勿依据本原型订票。')}</p>`;
}
function renderDock() {
  const t = [['trips', 'trips', L('Trips', '行程')], ['explore', 'explore', L('Explore', '探索')], ['memories', 'memories', L('Memories', '回忆')], ['me', 'me', L('Profile', '我的')]];
  $('#dock').innerHTML = `<div class="tabbar glass" role="tablist"><span class="lens" style="transform:translateX(${TABS.indexOf(curTab) * 100}%)"><i></i></span>${t.map(([k, i, n]) => `<button class="tab ${curTab === k ? 'on' : ''}" role="tab" aria-selected="${curTab === k}" data-act="tab" data-to="${k}">${ic(i)}<span>${n}</span></button>`).join('')}</div>
  <button class="fab glass press" data-act="compose" aria-label="${L('Plan a new trip', '规划新行程')}">${ic('plus')}</button>`;
}
function rebuildAll() { renderPanel(); renderDock(); refresh() }
function fit() { const d = $('#device'); if (innerWidth <= 860) { d.style.zoom = ''; return } const s = Math.min(1, (innerHeight - 40) / 874); d.style.zoom = s < 1 ? s.toFixed(3) : '' }
addEventListener('resize', fit); fit();
document.documentElement.lang = S.lang === 'zh' ? 'zh-CN' : 'en';
if (S.theme !== 'auto') applyTheme();
renderPanel(); renderDock(); renderTabs();
setTimeout(() => $$('.tabscreen').forEach(s => s.classList.add('calm')), 900);
if (!S.onboarded) onboarding();
mtBoot().then(ok => { if (ok && typeof MT_ENC !== 'undefined') rebuildAll(); mtResume() });
if ('serviceWorker' in navigator) {
  const sw = navigator.serviceWorker, had = !!sw.controller; let stale = false;
  const go = () => { if (stale && document.visibilityState === 'visible') mtFresh() };
  sw.addEventListener('controllerchange', () => { if (had) { stale = true; go() } });
  addEventListener('load', () => sw.register('sw.js').then(reg => document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { reg.update().catch(() => { }); go() } })).catch(() => { }));
}
